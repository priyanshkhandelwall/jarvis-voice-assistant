avoid = ["down", "lower", "quieter"]
template = "volume up"

[[intent]]
name = "volume_down"
no_statements = true
say = "turn the volume down"
description = "turn the volume down a step"
need = [["volume", "sound", "quieter"], ["down", "quieter", "decrease", "lower", "reduce", "less"]]
avoid = [" up"]
template = "volume down"

[[intent]]
name = "mute"
no_statements = true
say = "mute the sound"
description = "mute the speakers"
need = [["mute", "silence", "silent"]]
avoid = ["unmute", "un mute"]
template = "mute"

[[intent]]
name = "unmute"
no_statements = true
say = "unmute the sound"
description = "unmute the speakers"
need = [["unmute", "un mute", "sound back on"]]
template = "unmute"

[[intent]]
name = "brightness_set"
no_statements = true
say = "set the brightness"
description = "set the screen brightness to a percentage"
need = [["brightness", "bright"]]
also = [["set", "change", "make", "put", "adjust", "turn", "to"]]
slot = "number"
slot_required = true
template = "set the brightness to {slot}"

[[intent]]
name = "brightness_up"
no_statements = true
say = "make the screen brighter"
description = "screen brightness up a step"
need = [["brightness", "brighter", "screen"], ["up", "brighter", "increase", "raise", "more"]]
avoid = ["down", "dimmer", "dim"]
