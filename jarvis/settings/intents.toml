[[intent]]
name = "brightness_down"
no_statements = true
say = "dim the screen"
description = "screen brightness down a step"
need = [["brightness", "dimmer", "dim", "screen"], ["down", "dimmer", "dim", "decrease", "lower", "reduce", "less", "darker"]]
avoid = [" up"]
template = "brightness down"

[[intent]]
name = "wifi_off"
no_statements = true
say = "turn Wi-Fi off"
description = "turn the Wi-Fi radio off (needs a confirm)"
need = [["wifi", "wireless", "internet"], ["off", "disable", "disconnect", "kill", "stop"]]
template = "turn wifi off"

[[intent]]
name = "wifi_on"
no_statements = true
say = "turn Wi-Fi on"
description = "turn the Wi-Fi radio on (needs a confirm)"
need = [["wifi", "wireless"], ["on", "enable", "connect", "back"]]
avoid = ["off"]
template = "turn wifi on"

[[intent]]
name = "lock"
no_statements = true
say = "lock the screen"
description = "lock the laptop (needs a confirm)"
need = [["lock"]]
avoid = ["unlock", "lock screen wallpaper"]
template = "lock the screen"

[[intent]]
name = "restart"
no_statements = true
say = "restart the laptop"
description = "restart the laptop (needs two confirms)"
need = [["restart", "reboot"]]
avoid = ["jarvis", "the app", "yourself"]
template = "restart"

[[intent]]
name = "shutdown"
no_statements = true
say = "shut down the laptop"
description = "shut the laptop down (needs two confirms)"
need = [["shut down", "shutdown", "power off", "turn off the laptop", "turn off the computer", "switch off"]]
avoid = ["camera", "webcam", "wifi"]
template = "shut down"

[[intent]]
name = "sleep"
no_statements = true
say = "go to sleep"
description = "she stops listening until woken"
need = [["sleep", "goodnight", "good night", "nap", "rest", "bed", "bedtime", "bed time", "lights out"]]
avoid = ["i need", "i want", "can't sleep", "how to", "story", "stories", "routine", "tell me", "my bedtime", "bed sheets", "bed bugs"]
template = "go to sleep"

[[intent]]
name = "intro"
say = "introduce myself"
description = "she introduces herself"
# "a quick introduction", "who am I talking to", "who
# you are" went online; "introduce yourself to the class" asked "Did you
# mean...?". The audience ("to the class") is a free slot the intro ignores.
# "who are you" / "what are you" moved to identity_who
# (a short answer, not the whole intro).
need = [["introduce", "introduction", "intro", "about yourself", "your name"]]
avoid = ["change your name", "rename", "call you", "my name", "his name", "her name", "stand for", "stands for", "your name mean"]
slot = "rest"
template = "introduce yourself"

# "What does Jarvis stand for" went online and Groq made
# up an expansion; "Who you at" (Whisper's "who are you") went online. These
# four are answered locally from intro.txt and [identity] (jarvis/actions/intro.py).
[[intent]]
name = "identity_who"
say = "say who I am"
description = "who or what she is"
need = [["who are you", "who you are", "who r you", "who are u", "who you at", "who are ya", "who you r", "what are you",
         "who am i talking to", "who am i speaking to", "who am i speaking with", "who is this", "who's this"]]
avoid = ["what are you doing", "what are you up to", "what are you tracking", "what are you following", "what are you watching"]
slot = "rest"
template = "say who you are"

[[intent]]
name = "identity_stands_for"
about_me = true
say = "say what my name stands for"
description = "what the name JARVIS stands for"
need = [["stand for", "stands for", "short for", "full form", "acronym", "abbreviation", "name mean", "name means", "expand", "expansion"]]
slot = "rest"
template = "what does your name stand for"

[[intent]]
name = "identity_creator"
about_me = true
say = "say who made me"
description = "who made or created her"
need = [["who made", "who created", "who built", "who designed", "who programmed", "who invented", "who developed", "who wrote",
         "your creator", "your maker", "your developer", "who owns", "who is your"]]
also = [["you", "your"]]
avoid = ["who is your favourite", "who is your favorite"]
slot = "rest"
template = "say who made you"

[[intent]]
name = "identity_abilities"
about_me = true
say = "say what I can do"
description = "what she is able to do"
need = [["what can you do", "what do you do", "what are you able to do", "what are your abilities", "your abilities",
         "your features", "what can you help", "how can you help", "what are you capable of", "what are your skills",
         "what else can you do", "what all can you do"]]
# No slot: "what can you do in excel" is a question about Excel, not about her.
base = 0.55
template = "say what you can do"

[[intent]]
name = "why"
say = "explain what I just did"
description = "why she did her last action, from her own record"
# "Explain what you just did" needed the online classifier.
need = [["why", "how come", "reason", "explain what you", "what did you", "what have you"],
        ["did", "do", "done", "that", "you", "opened", "did that"]]
avoid = ["sky", "people", "is the"]
template = "why did you do that"

[[intent]]
name = "topics_list"
say = "list the topics I'm tracking"
description = "list the news topics she is tracking"
need = [["tracking", "tracked", "track", "topics", "following", "watching", "watch list"]]
also = [["what", "which", "list", "show", "tell me"]]
avoid = ["news", "headlines", "update", "untrack", "stop tracking"]
template = "what am i tracking"

[[intent]]
name = "topics_check"
say = "check the news on your topics"
description = "check the news for the topics she is tracking"
need = [["news", "headlines", "updates", "check"], ["topics", "topic", "tracked", "tracking"]]
also = [["news", "headlines", "updates", "anything new", "any"], ["tracked", "tracking", "my"]]
template = "any news on my topics"

[[intent]]
name = "topic_track"
at_start = true
say = "track a news topic"
description = "start tracking a news topic"
need = [["track", "follow", "keep an eye on", "keep track of", "monitor"]]
avoid = ["what", "which", "stop", "untrack", "list", "my topics"]
slot = "rest"
slot_required = true
template = "track {slot}"

[[intent]]
name = "briefing"
say = "give you the briefing"
description = "the morning briefing: weather and headlines"
need = [["brief", "briefing", "rundown", "catch me up", "daily update", "morning update"]]
also = [["give me", "catch me up", "can i get"], ["daily", "morning", "today", "quick", "today's"]]
template = "brief me"

[[intent]]
name = "thanks"
say = "say you're welcome"
description = "he thanks her"
need = [["thanks", "thank", "cheers", "appreciate", "ta", "thx"]]
template = "thank you"
