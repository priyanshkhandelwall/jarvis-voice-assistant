                   "evening", "night", "later", "weekend", "week", "next", "day", "days", "weather", "whether", "forecast", "temperature", "temp",
                   "hot", "cold", "warm", "chilly", "freezing", "humid", "sunny", "cloudy", "windy", "snowy", "snowing", "snow", "stormy", "storm",
