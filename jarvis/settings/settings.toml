[memory.never_store]
# R11 + the developer's F10 decision: never stored, and the refused text is
# never written anywhere (redact_sensitive uses the same check).
# ("remember my card number 411 111 111 111" was
# stored -- it fails the Luhn check): a word below plus ANY digit, number
# word or value ("is hunter2") is refused, whatever the digits are. The word
# alone is fine: "remember to change my password" is stored. Luhn is still
# used for a bare card number with no word.
password_words = ["password", "passwords", "passcode", "passphrase", "api key", "secret key", "private key", "access token", "recovery code", "backup code", "seed phrase", "login details"]
pin_words = ["pin", "pin code", "pin number", "cvv", "cvc", "security code", "otp", "one-time code", "one time code", "verification code", "2fa code"]
card_words = ["card number", "card numbers", "card no", "credit card", "debit card", "card details"]
bank_words = ["account number", "bank account", "bsb", "iban", "routing number", "sort code", "swift code"]
# A value follows one of the words above: "<word> is <something>",
# "<word> to <something>", "<word>: <something>".
value_link_words = ["is", "are", "was", "were", "to", "=", ":"]
# Spoken digits count as digits ("my pin is four three two one").
number_words = ["zero", "oh", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"]
# An ID number needs its keyword AND a token with at least this many digits.
min_id_digits = 5
# A word this many letters from a one-word keyword above (bin/pen/pinn -> pin,
# passward -> password), with a number of at least fuzzy_min_digits digits,
# is refused. Never shorter than the keyword ("in" is not "pin").
fuzzy_max_distance = 1
fuzzy_min_digits = 4
# "my <word> 44555": a bare 4-8 digit number right after "my <word>" (or
