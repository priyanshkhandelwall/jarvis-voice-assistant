[browser]
# F16b (the developer's decision): "search X", "google X" and
# "open chrome and search X" open a Google search for X in his own Chrome --
# exactly like opening a website (open_url, L1), with no automation and
# nothing read back. JARVIS's own Playwright browser, its Chromium download
# and DuckDuckGo are removed.
search_url = "https://www.google.com/search?q={query}"
# F16's last resort: a LIVE question whose online search failed in one of
# these ways opens the Google results in Chrome instead. A missing key,
# today's allowance, a rate limit or no internet keep their own answers
# (spec F16).
fallback_on = ["TIMEOUT", "SERVICE_ERROR", "EMPTY_RESPONSE", "NO_RESULTS", "CUT_OFF"]
# "google chrome", "google docs" etc. are apps and sites, not searches.
# Dropped from the front of a query ("search google's best pizza" -> "best pizza").
query_lead_words = ["google's", "googles", "google", "on google", "in google", "with google", "for"]
google_not_queries = ["chrome", "docs", "drive", "maps", "sheets", "slides", "calendar", "photos", "meet", "classroom", "translate", "earth", "keep", "mail", "news", "play", "play store", "chrome browser"]

# What counts as a search (regular expressions over the cleaned command,
# which has no commas and is lower case; `query` is what is searched).
[[browser.commands]]
pattern = '''(?:open|launch|start|run)(?: up)?(?: google)? chrome(?: browser)?(?: and)?(?: then)? (?:search|google|look up)(?: for| up)? (?P<query>.+)'''

[[browser.commands]]
pattern = '''search(?: for)? (?P<query>.+?) (?:on|in) (?:the )?(?:web|internet|google|chrome)'''

[[browser.commands]]
# "look up the meaning of serendipity online" searched for "... online".
# Only "look up": "search for how to stay online" keeps its last word.
pattern = '''look up (?P<query>.+?) online'''

[[browser.commands]]
pattern = '''(?:search|look up)(?: on)?(?: the)? (?:web|internet|google|online)(?: for)? (?P<query>.+)'''

[[browser.commands]]
pattern = '''(?:search google|google search)(?: for)? (?P<query>.+)'''

[[browser.commands]]
pattern = '''search(?: for)? (?!.* on (?:my|the) screen$)(?P<query>.+)'''

[[browser.commands]]
pattern = '''google(?: for)? (?P<query>.+)'''

[browser.replies]
searching = "Searching Google for {query} in Chrome."
fallback_opened = "I couldn't get a quick answer, so I've opened the results in Chrome."
no_chrome = "I'd search Google for {query} in Chrome, but Chrome isn't installed. Install Google Chrome, then try again."
no_chrome_fallback = "I couldn't get a quick answer, and Chrome isn't installed, so I can't open the results. Install Google Chrome, then try again."

[screen]
# F8 screen awareness (the developer's F8 decisions).
# Passive capture only (read pixels), local OCR with Windows' own engine,
# protected windows blacked out before anything uses the image, the image
# in memory only and freed after use.
#
# PROTECTED windows (§11 #12, resolved; edit freely): a window
# whose title contains any of these words (case-insensitive), or whose
# program is one of protected_processes, is blacked out, and its title is
# never spoken or sent. She cannot see a sensitive page inside an ordinary
# browser tab whose title doesn't match.
protected_title_words = ["1password", "bitwarden", "keepass", "lastpass", "bank", "banking", "netbank", "commbank", "paypal", "inprivate", "incognito", "private browsing", "private window", "windows security"]
protected_processes = ["1password.exe", "bitwarden.exe", "keepass.exe", "keepassxc.exe", "lastpass.exe", "sechealthui.exe", "securityhealthhost.exe"]
# "explain my screen": the image model (verified on Groq's live /models on
# The only free-tier model with image input; each image counts
# as 2048 input tokens; at most 3 images per request). Empty string = send
# the OCR text only, with the normal text model.
vision_model = "qwen/qwen3.8-27b"
# The image as sent: at most this many pixels on its long side, JPEG. A
# 1920x1080 screen becomes 1280x720, about 30-150 KB.
send_max_side = 1280
send_jpeg_quality = 70
send_max_text_chars = 3000
# The developer has not checked Groq's data-use terms yet: until this is
# true the preview says "Online service terms not yet checked by you".
online_terms_checked = false
instructions = "You are looking at a screenshot of the developer's Windows screen, with the text read from it and his question. Explain what is on the screen and answer the question: text, images, charts, code, errors and the user interface. A solid black rectangle is a private window hidden on purpose by JARVIS: ignore it completely, don't mention it, never guess what is in it, and never ask anyone to remove, lift or uncover it; describe everything else. A screenshot is one moment; don't claim to know what happens over time."
# Added to the instructions with the real count of hidden windows.
covered_note_none = "In this screenshot no window was blacked out: dark areas are just dark windows or backgrounds; describe them normally."
covered_note_some = "In this screenshot {count} private window(s) were blacked out on purpose; ignore those black rectangles."
# The summary ("what's on my screen").
summary_windows = 4
summary_lines = 3
min_line_chars = 4
# ("123456789_1111222€ X +. Ask Gemini. claude.ai/chat/7488..."
# was read out). A browser's own UI -- the tab strip, address bar and
# bookmarks -- is the top browser_ui_band_px of its window and is never read;
# neither are URLs, long numbers or IDs, file-name noise, or lines that are
# mostly symbols. Lines holding only a ui_phrases entry are skipped too.
browser_processes = ["chrome.exe", "msedge.exe", "firefox.exe", "brave.exe", "opera.exe", "vivaldi.exe", "arc.exe"]
browser_ui_band_px = 120
ui_phrases = ["ask gemini", "new tab", "search google or type a url", "bookmarks", "all bookmarks", "relaunch to update", "reading list", "customize chrome", "sign in", "share", "extensions", "update", "open in app", "copilot", "new chat", "share chat", "upgrade"]
# A line must keep this many real words (3+ letters) after the noise is gone.
min_real_words = 2
# ...and at least this share of its characters must be letters or spaces.
min_letter_share = 0.6
line_max_chars = 80
title_max_chars = 60
# "where is it" right after a find is answered from that find
# for this many seconds (while nothing else was looked at since).
follow_up_seconds = 120
# (she read "(22) YouTube - Google Chrome and
# Program Manager" and nothing else). Never read or named: the desktop, the
# taskbar and JARVIS's own window (window class, exact title or program).
system_window_classes = ["Progman", "WorkerW", "Shell_TrayWnd", "Shell_SecondaryTrayWnd", "NotifyIconOverflowWindow", "Windows.UI.Core.CoreWindow"]
system_window_titles = ["Program Manager", "JARVIS", "Flet"]
own_processes = ["flet.exe"]
# A window counts as showing when at least this share of it is on top.
min_visible_share = 0.05
# The summary's first lines: at most this many characters.
first_lines_max_chars = 160
# The one sentence said about the window in front -- the line with
# the most real words (3+ letters) of its first front_scan_lines, at least
# front_min_words of them, and not a list of names (more than
# front_max_capital_share of its words capitalised, or comma-separated scraps).
front_scan_lines = 12
front_min_words = 4
front_max_capital_share = 0.6
read_phrases = ["what's on my screen", "what is on my screen", "whats on my screen", "read my screen", "read the screen", "read what's on my screen", "read what is on my screen", "what's on the screen", "what is on the screen", "look at my screen", "what can you see on my screen", "what do you see on my screen", "what's open on my screen", "what windows are open"]
explain_phrases = ["explain my screen", "explain the screen", "explain what's on my screen", "explain what is on my screen", "help me with this", "what am i looking at", "can you help me with this", "explain this"]
# Shown when the Sensor Array's Screen Capture row is clicked or hovered.
row_click_text = "Screen capture runs only when you ask, for example 'what's on my screen'. Protected windows are blacked out and nothing is saved."
# "is the word Marigold on my screen" went online.
find_pattern = '''(?:find|look for|search for|is there|is|are there|can you see|do you see|see)(?: the word| the text| the name| the number)? (?P<word>.+?) (?:on|anywhere on) (?:my|the) screen|does (?:my|the) screen (?:say|show|have|contain)(?: the word| the text)? (?P<word2>.+)'''
# Whisper's "explain" before "my screen" ("Splend my screen",
