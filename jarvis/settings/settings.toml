[camera]
# F9 webcam vision (the developer's F9 decisions). Camera
# through OpenCV (opencv-python-headless 5.0.0.93, Apache-2.0: no GUI module,
# so it can never open a window). Frames stay in memory, never saved.
# The camera to try first; other indices are probed only inside a capture
# the developer asked for (never at startup), up to max_index_probe.
index = 0
max_index_probe = 5
# Exposure settles over the first frames: these are read and thrown away.
warmup_frames = 10
# After
# the warm-up, look_frames frames are kept (look_frame_gap frames skipped
# between them) and an object is named only if it was found in at least
# look_min_votes of them, at min_confidence or more. The live camera votes
# over its last look_frames detections the same way.
look_frames = 3
look_frame_gap = 2
look_min_votes = 2
# A frame darker than this (mean brightness of 0-255) is a failed capture
# (R12: retry once, then say the camera returned a black image).
min_mean_brightness = 8
# Object detector: YOLOX-S (Megvii, Apache-2.0; 36 MB), the 80 COCO types,
# on onnxruntime. Downloaded by scripts/download_models.py. Chosen over
# YOLOX-Tiny on YOLOX's own sample photo: S said dog 0.91 in
# 115 ms; Tiny said cat 0.56 / dog 0.54 for the same dog in 31 ms.
detector_dir = "models/yolox"
detector_file = "yolox_s.onnx"
detector_url = "https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_s.onnx"
detector_input_size = 640
# 0.45 -> 0.6. A steady object below sure_confidence is said as
# "I think I see ..." rather than "I can see ...".
min_confidence = 0.6
sure_confidence = 0.75
nms_iou = 0.45
# Two different labels on (nearly) the same box: only the more confident is kept.
duplicate_iou = 0.7
# OpenCV capture backend: "dshow" (DirectShow, opens fastest on Windows),
# "msmf" (Media Foundation) or "any".
backend = "dshow"
# At most this many objects are named in one answer.
max_objects_spoken = 5
# Price table (the developer keeps it by hand; §11 #5): object, low, high,
# currency, date_updated, source. Rough figures, always spoken as a range.
price_table = "jarvis/settings/prices.csv"
# Older than this, or no date: she still gives the range but says it is out of date.
price_stale_months = 12
# "turn on the camera" (continuous, L3): a small preview for the Webcam Feed
# panel, capped low for R15, and detections in Live Activity every few seconds.
stream_fps = 5
stream_preview_width = 320
stream_jpeg_quality = 70
stream_detect_seconds = 5
stream_start_timeout_seconds = 6
generic_brand_words = ["brand", "model", "make", "manufacturer", "maker", "company"]
look_phrases = ["what do you see", "what can you see", "look through the camera", "look through the webcam", "what's this", "what is this", "what's on my desk", "what is on my desk", "take a look", "have a look", "look at this", "what am i holding"]
price_phrases = ["how much is this", "how much is that", "how much does this cost", "how much does that cost", "how much is this worth", "what's this worth", "what is this worth"]
