[mood]
# F14 (built): how upset the developer sounds, 0-1, from
# his words only, on the laptop. A guess (R19): it never changes what she
# does and is never saved. Set enabled = false to turn it off.
enabled = true
# She checks in when the score is at least this. Spec starting value 0.8;
# set to 0.6 from the 30-sentence test (tests/test_f14_mood.py): no false check-in on any
# of the 15 calm/joking sentences from 0.40 up (highest calm score 0.30);
# recall 14/15 at 0.40-0.60 but only 6/15 at 0.8. 0.6 keeps that recall
# with the widest margin above the calm ones.
threshold = 0.6
# At most one check-in per this many seconds (spec: 10 minutes).
cooldown_seconds = 600
# Scoring (jarvis/speech/mood.py): each cue below gives its weight alone;
# more cues push the score toward 1 (noisy-OR).
intensity_boost = 1.3          # "so annoying": an intensifier right before a cue
max_cue_weight = 0.95          # no single cue reaches 1 on its own
negation_factor = 0.1          # "not frustrated": a negation shortly before a cue
negation_window = 2            # words before a cue checked for a negation
positive_damping = 0.5         # "damn, that's impressive": any positive word halves it
exclaim_boost = 0.05           # each "!" (typed) adds this to a non-zero score
exclaim_max = 3
intensifiers = ["so", "really", "very", "extremely", "totally", "absolutely", "completely", "super", "freaking", "bloody", "fucking", "too"]
# A sweeping word up to sweeping_window words before a cue
# ("everything is broken", "it keeps freezing") multiplies it by sweeping_boost.
