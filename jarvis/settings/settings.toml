# F16a (built): Open-Meteo, free, no key. Non-commercial
# use only (personal/educational is allowed); data is CC BY 4.0, so the
# credit line below is shown under every weather answer (R3's exception).
# Limits: 600 calls/min, 5,000/hour, 10,000/day (open-meteo.com/en/terms).
default_city = "Sydney"            # developer's choice; empty = she asks which city
dominant_population_ratio = 10     # top result this many times bigger than any other country's -> no question
