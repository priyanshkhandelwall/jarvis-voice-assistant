# F2 (decision F): she greets only when greeted, answered
# locally (no Groq). A trailing "jarvis" is ignored ("hello jarvis").
phrases = ["hello", "hi", "hey", "hiya", "good morning", "good afternoon", "good evening", "morning", "evening"]
reply = "Good {period}. How can I help?"
# "good afternoon to you", "morning everyone" -- still a greeting.
tail_words = ["to", "you", "there", "everyone", "all", "mate", "sir", "buddy", "friend", "again", "today"]

# -- The wake greeting (redesigned) -------------------------------
# Spoken on EVERY wake (wake word, wake phrase, hotkey, typed) and shown in
# Live Activity. Picked at random, locally, never online, from
# [greeting.pools] below. {name} is [user] name.
# Time bands, by the hour each one STARTS (24-hour clock). Late night runs
# from late_night_from round midnight to early_morning_from.
early_morning_from = 5
morning_from = 9
afternoon_from = 12
evening_from = 17
late_night_from = 21
# Woken again within this many minutes of going to sleep: a "welcome back" line.
welcome_back_minutes = 30
# None of the last this-many greetings is said again.
no_repeat_count = 5
# Said when the pool that applies is missing or empty.
fallback = "Hello, {name}. How can I help?"
# Remembers (across restarts) the last few greetings, the day of the last
# wake and when she last went to sleep -- nothing else. Data folder (R18).
state_path = "jarvis_data/greeting_state.json"

[greeting.pools]
# Which pool, in order: welcome_back (woken within welcome_back_minutes of
# sleeping), late_night (21:00-04:59), first_wake (first wake of the day;
# a day starts at early_morning_from), then the time band. Keep each line
# short (about 12 words at most). Edit freely.
early_morning = ["Morning, {name}. Early start today?", "Up early, {name}. What's first?", "Good morning. Let's get going."]
morning = ["Good morning, {name}. What are we doing today?", "Morning, {name}. Ready when you are.", "Hey {name}. What's on the list?"]
afternoon = ["Good afternoon, {name}. What can I do?", "Afternoon, {name}. How's the day going?", "Hey {name}. What do you need?"]
evening = ["Good evening, {name}. How can I help?", "Evening, {name}. What's next?", "Hey {name}. Let's get it done."]
late_night = ["Burning the midnight oil, {name}?", "Late one tonight. What do you need?", "Still up, {name}? I'm here."]
first_wake = ["Morning, {name}. Fresh start. What's first?", "Good to see you, {name}. Let's begin."]
welcome_back = ["Welcome back, {name}.", "Back already? What's up?", "Hey again, {name}."]
# Time-neutral lines, used only when every line of the pool above was among
# the last no_repeat_count greetings (the pools above have 2-3 lines each,
# too few to avoid 5 repeats on their own).
anytime = ["Hi, {name}. What can I do?", "I'm here, {name}. What's up?", "Ready, {name}. What's next?", "Hello, {name}. What do you need?", "Hey {name}. I'm listening.", "Hi {name}. Where do we start?"]

[user]
# The developer's name, used in the wake greeting.
name = "Priyansh"

[identity]
# F1 (log: "What does Jarvis stand for" went online and Groq
# invented "Just A Reasonable Intelligent Virtual Assistant"). Answered locally
# (jarvis/actions/intro.py); the expansion is read from intro.txt itself.
creator = "Priyansh"
stands_for_reply = "JARVIS stands for {expansion}."
creator_reply = "{creator} created me."
# "who are you": two sentences of the locked intro, from this one (1-based;
# sentence 1 is "Hello everyone.", a greeting to an audience).
who_from_sentence = 2
who_sentence_count = 2
abilities_reply = "I can open apps, find files, read and summarise documents, read your screen, look through the camera, remember things for you, check the weather and the news, search the web, and change the volume and brightness."
# Added to every online prompt, so Groq never invents another expansion.
prompt_rule = "Your name JARVIS stands for exactly \"{expansion}\"; never give any other expansion. You were created by {creator}."

[conversation]
# Conversation mode (developer-approved; merges F2 and F15).
# She starts SLEEPING. Any of these wakes her -- spoken (matched against
# the local transcript; the wake-word model also listens for "Hey JARVIS")
# or typed. Punctuation and case are ignored; a transcript that starts
# with a wake phrase counts.
wake_phrases = ["wake up jarvis", "jarvis wake up", "hey jarvis"]
# Fuzzy name (Whisper heard "Johnless", "Javis",
# "Charvis"). A word counts as her name if it is in this list, or is within
# name_max_edit_distance letters of "jarvis" (only for words of at least
# name_min_length letters, so "is"/"job" never count).
name_variants = ["jarvis", "javis", "jarvas", "jarves", "jarvus", "jarviss", "jarvice", "charvis", "chavis", "jervis", "johnless", "travis", "service", "harvis", "garvis", "darvis", "jaavis"]
name_max_edit_distance = 2
name_min_length = 4
# Fuzzy wake forms, each needing a name-like word: "<verb> up <name>",
# "<name> <verb> up", "welcome <name>", "hey <name>". "make up" and
# "welcome" are common mishearings of "wake up". The phrase may start at
# the first or second word ("okay, wake up Jarvis").
wake_verbs = ["wake", "make", "wakes", "woke"]
wake_greeting_words = ["hey", "hi", "hello", "okay", "ok", "welcome"]
# "Wake up" while she is already AWAKE: answered locally.
already_awake_reply = "I'm already awake."
# "Go to sleep" -- handled locally, never sent online. A leading or
# trailing "jarvis" is ignored ("goodnight jarvis", "jarvis go to sleep").
sleep_phrases = ["go to sleep", "sleep", "goodnight", "good night", "time to sleep", "go to sleep now", "sleep now", "good night then", "go sleep", "goto sleep", "got to sleep", "time for sleep", "time to go to sleep", "you can sleep", "you can go to sleep"]
# A typed "got to sleep" went online. A phrase with "sleep" in it
# also matches within this many letters (Whisper/typos: "go to sleap", "gone to sleep").
# Only phrases containing "sleep" are matched loosely, so "good light" never sleeps.
sleep_max_edit_distance = 2
# Whisper mishearings of "go to sleep" with no "sleep" in them ("GOTA SLIDE").
sleep_mishearings = ["gota slide", "go to slide", "gotta sleep", "gotta slide", "got to slide", "goto slide", "go to sleet"]
sleep_reply = "Goodnight."
# ("Thank you, go to sleep" and "Hijar, VS Code to
# Sleep" went online): a sleep phrase at the END of a longer sentence sleeps
# too, and so does any sentence ending "... to sleep". These words may come
# after the phrase ("go to sleep now please").
sleep_tail_words = ["now", "please", "then", "thanks", "thank", "you", "for", "a", "while", "bit", "ok", "okay"]
# A sentence starting with one of these is a question or another command,
# never sleep ("how much should I sleep", "what is sleep mode", "remind me
# to go to sleep").
sleep_question_starts = ["how", "what", "what's", "whats", "why", "when", "where", "who", "which", "should", "do", "does", "did", "is", "are", "was", "were", "will", "would", "remember", "remind", "note", "search", "google", "find", "explain", "tell", "define", "can", "could"]
# "... <word> to sleep" is about him, not an order to her: "I need to sleep",
# "I want to sleep", "I'm not able to sleep".
sleep_not_after = ["need", "needs", "want", "wants", "wanted", "have", "has", "had", "going", "gonna", "used", "like", "likes", "love", "loves", "try", "trying", "tried", "able", "unable", "hard", "easy", "ready", "trouble", "help", "me", "him", "her", "them", "us", "baby", "kids", "went", "gone", "goes", "fell", "falls", "put", "puts"]
# While AWAKE every utterance is a command, except fragments: fewer than
# min_words words, or Whisper's no-speech probability above
# max_no_speech_prob. These are logged as "ignored" and never sent online.
min_words = 2
max_no_speech_prob = 0.6
# An utterance Whisper starts with one of these in lower case was heard from
# the middle of a sentence (a video, someone else talking): ignored, never
# sent online. "And open Notepad" (capital A) is still a command.
mid_sentence_starts = ["and", "but", "or", "because", "cause", "so", "then", "which", "that", "of", "to", "with"]
# One-word commands that are never treated as fragments.
# F22's one-word commands were dropped as "too short"
# when spoken ("Mute", "Unmute", "Restart"); typed they always worked.
# "briefme" is Whisper's run-together "Brief me".
single_word_commands = ["confirm", "cancel", "stop", "goodnight", "sleep", "hello", "hi", "hey", "thanks", "yes", "no", "mute", "unmute", "restart", "shutdown", "briefme", "ok", "okay", "cheers"]
# A known app name alone ("Notepad") opens it -- except these
# ("camera" means F9's webcam, never the Camera app).
single_word_not_apps = ["camera", "settings", "google", "code", "edge"]
# Minutes awake with nothing said before she goes back to sleep by
# herself. 0 = never (the developer's choice).
auto_sleep_minutes = 0
# Typed text while she is asleep (other than a wake phrase) is discarded,
# never logged (F15); this notice says how to wake her.
asleep_typed_notice = "I'm asleep. Say or type 'wake up JARVIS' to wake me."
# "Cancel" while a confirmation is pending.
cancel_word = "cancel"
cancelled_reply = "Cancelled."
# Said when a pending confirmation runs out ([controller]
# confirmation_timeout_seconds) with no confirm or cancel.
confirmation_expired_reply = "That waited too long, so I've cancelled it. Ask again if you still want it."
# L4 (two confirmations, e.g. F10's "forget everything"): said after the first.
confirm_again_reply = "Say confirm once more to go ahead."
nothing_to_cancel_reply = "There's nothing to cancel."
# "Confirm" with nothing waiting (Section 5: she says so).
nothing_to_confirm_reply = "Nothing to confirm right now."
# while she waits for a confirmation, a sentence counts when its ONLY command
# words are confirm words, or only cancel words, and every other word is in
# confirm_filler_words. Both kinds in one sentence: she asks again. Section 5
# is unchanged (expiry, exact action, L4's two confirms; never while SPEAKING).
confirm_words = ["confirm", "confirmed", "yes", "yeah", "yep", "go ahead", "send it"]
cancel_words = ["cancel", "no", "nope", "stop", "don't", "dont", "don't send it", "dont send it", "skip", "skip it"]
confirm_filler_words = ["please", "ok", "okay", "alright", "all right", "now", "online", "it", "that", "this", "then", "thanks", "thank", "you", "sure", "and", "just", "i", "said", "the", "preview", "screen", "screenshot", "do", "so", "fine", "right", "away"]
confirm_or_cancel_reply = "I heard both confirm and cancel. Say confirm to go ahead, or cancel to stop."
# Anything else heard while she waits ("Confine", "can
# find") gets this reminder (cached audio), at most once per
# confirm_reminder_seconds.
confirm_reminder_reply = "Say confirm or cancel."
confirm_reminder_seconds = 10

[explain]
# F5/R13: "why did you do that?" is answered locally from the latest
# decision record, never by Groq. A command matches if it starts with one
# of the prefixes or is exactly one of the phrases (punctuation and a
# leading or trailing "jarvis" ignored).
# "why'd you",
# "how come you did ..." and "why do you do that" too. "why do you" alone is
# not a prefix: "why do you think the sky is blue" is a question for online.
prefixes = ["why did you", "tell me why", "explain why", "why did u", "why'd you", "whyd you", "why would you", "how come you did", "how come you opened", "how come you went", "how come you said"]
phrases = ["explain that", "why that", "why was that", "why do you do that", "why do you keep doing that", "why you do that", "why did that happen", "what did you do that for", "how come", "how come you did that"]

[logbook]
# R15: when each startup step finished, appended per launch
# (numbers and step names only), for measuring startup time.
startup_timings_path = "jarvis_data/logs/startup_timings.log"
# F5 decision records: kept in memory for the session only (§11 #8,
# resolved). Oldest records are dropped past this cap so a
# long session cannot grow memory without bound (R15).
max_records = 500
# Raw record detail (matched action + params, candidate scores, trust
# level, origin, raw result) for troubleshooting -- kept out of the
# dashboard's Live Activity panel. Relative to the project root, inside
# the data folder (excluded from Git, R18). The one exception to
# "session only": it persists, redacted, capped below (oldest lines
# dropped first).
debug_log_path = "jarvis_data/logs/debug.log"
debug_log_max_bytes = 1048576
# R11/F15: every free-text field a decision record stores (heard,
# understood, choice, candidates, result, verification result) is passed
# through redact_sensitive() in jarvis/logbook/records.py. If a marker
# below is found, the whole field is replaced with redacted_placeholder,
# never just the matched word -- there's no reliable way to know where a
# secret starts or ends. Case insensitive. This is a best-effort net --
# no feature in this build actually captures passwords or Sleep Mode
# words yet (F15 keeps them in memory only), so it has nothing real to catch
# until those exist; it is here so the record pipeline is already safe
# when they are added.
#
# Two matching modes, one list each:
# - boundary: short words that plain substring matching would also catch
#   inside ordinary words ("otp" inside "hotpot"/"footpath", "pin" inside
#   "opinion"/"pineapple"/"spin"). Matched only as a whole word.
# - phrase: longer, more distinctive words/phrases where plain substring
#   matching stays good enough by the developer's own instruction. Known
#   residual gap, kept rather than silently "fixed": "secret" still
#   matches inside "secretary" -- see README.
sensitive_markers_boundary = ["otp", "pin"]
sensitive_markers_phrase = ["password", "passcode", "api key", "api_key", "secret", "token"]
redacted_placeholder = "[redacted]"

[speech]
# F2 text-to-speech (pyttsx3). The voice is chosen by exact name. If it is
# not installed, the first installed voice whose language starts with
# fallback_voice_language_prefix is used, and the dashboard says how to
# add Zira (decision E).
voice_name = "Microsoft Zira Desktop"
fallback_voice_language_prefix = "en"
# Longest a single utterance may block before she carries on (a stuck
# speech engine must never freeze a command forever).
speak_timeout_seconds = 60
# How long startup waits for the speech engine before going text-only.
startup_timeout_seconds = 10
# How often the speech worker pumps Windows' speech events while talking.
pump_interval_seconds = 0.02
# R3, decision D: said during UNDERSTANDING, right before a request
# leaves the laptop.
# She says this, never a provider name (developer). The
# activity log still records where the request went (R3).
checking_online_text = "Searching online."

# F2 Stage 3: how Stop cuts speech (R8). "engine_stop" = the speech thread
# calls pyttsx3's engine.stop() mid-utterance; "sentence" = speak one
# sentence at a time and stop between sentences. Chosen by testing on
# the development laptop.
stop_method = "engine_stop"
# After engine.stop(), Windows speech needs a moment to finish purging:
# an utterance started straight away "finished" in 40 ms without playing
#. 0.1 s was enough there; 0.25 s leaves margin.
stop_settle_seconds = 0.25
# Self-echo guard: the microphone is ignored while she speaks and for this
# long afterwards (raised from 0.3 to 0.6 for conversation mode),
# so she never responds to her own voice.
echo_tail_seconds = 0.6
# Which voice engine speaks. "kokoro" (kokoro-onnx, local neural voice) is
# JARVIS's voice: the developer chose Kokoro af_bella after comparing
# voice samples. "pyttsx3" (Windows SAPI, Zira)
# is only the fallback: a missing Kokoro package or model falls back to it
# with a missing-setup message, shown and spoken. "piper" stays optional
# (requirements-voices.txt). Stop, the echo guard and markdown stripping
# work the same for every engine.
engine = "kokoro"
# Kokoro/Piper play in blocks this long; Stop takes effect between blocks.
neural_block_seconds = 0.05
# Each sentence's
# own leading and trailing quiet (samples below silence_threshold) is cut,
# (measured: Kokoro adds about 0.03-0.05 s each side; the big gaps were the
# sound device reopened for every sentence),
# keeping edge_keep_seconds, and exactly sentence_gap_seconds of silence goes
# between sentences: with both kept edges, about 0.1 s heard. One output
# stream plays the whole line.
sentence_gap_seconds = 0.06
edge_keep_seconds = 0.02
silence_threshold = 0.004
# The first thing said is the first sentence, so a long one is cut at a
# comma, semicolon, colon or dash and starts playing sooner -- but only
# where the head is at least first_chunk_min_chars and the rest of the
# sentence is at most first_chunk_tail_ratio x the head, so the rest is
# ready before the head finishes (otherwise she would pause mid-sentence).
# Measured on this laptop's CPU, Kokoro takes about
# 0.3 s + 0.032 s per character to make 0.063 s of speech per character,
# so the break-even ratio is about 2; 1.5 leaves margin.
first_chunk_max_chars = 60
first_chunk_min_chars = 12
first_chunk_tail_ratio = 1.5
# Said silently once after the model loads, so the first real line doesn't
# pay ONNX Runtime's first-run cost.
warm_up_text = "Ready."

[speech.kokoro]
# kokoro-onnx 0.6.1 (MIT) running Kokoro-82M (Apache-2.0), CPU only.
# Files: scripts/download_models.py (the default run).
model_dir = "models/kokoro"
# Full precision (310 MB), not int8 (88 MB): measured on the development laptop
# after warm-up, voice af_bella: "Good afternoon." took 0.81 s to
# synthesise in full precision and 2.6-2.9 s in int8, because ONNX
# Runtime's CPU ConvInteger kernel (75% of int8's time) has no fast path.
# The developer chose full precision for the ~1 s first-sentence target.
model_file = "kokoro-v1.0.onnx"
voices_file = "voices-v1.0.bin"
voice = "af_bella"
speed = 1.0
language = "en-us"

[speech.piper]
# piper-tts 1.8.0 (GPL-3.0-or-later), CPU only. Each voice has its own
# licence (see scripts/download_models.py). Files: --voices piper.
model_dir = "models/piper"
voice = "en_GB-alba-medium"
download_voices = ["en_GB-alba-medium", "en_US-amy-medium", "en_US-hfc_female-medium"]
length_scale = 1.0

[voice_cache]
# Pre-rendered audio for her fixed lines (jarvis/speech/voice_cache.py):
# the intro, greetings, sleep/awake replies, rude replies, mood check-ins
# and setup messages play at once instead of after Kokoro has made the
# first sentence. Rebuilt in the background after startup whenever the
# text, voice or model changes. Never submitted (it rebuilds itself).
enabled = true
dir = "jarvis_data/voice_cache"
# Silence added between the sentences of a cached line. Each sentence
# Kokoro makes already ends in about 0.1 s of silence: joined with none,
# the intro was 0.6 s LONGER than Kokoro saying it in one go.
join_pause_seconds = 0.0

[models]
# F2 Stage 2 model files, relative to the project folder. Downloaded once
# by scripts/download_models.py (needs internet that one time only).
wake_word_dir = "models/openwakeword"
wake_word_model = "hey_jarvis_v0.1.onnx"
melspectrogram_model = "melspectrogram.onnx"
embedding_model = "embedding_model.onnx"
# base.en since a benchmark on the development laptop, 52 clips of real commands -- word error rate 0.8% vs 5.6%,
# median 1.03 s per command, worst 1.42 s, same 141 MB. small.en was more
# accurate on paper (0.4%) but took 3.3 s; distil-small.en 29%.
whisper_dir = "models/faster-whisper-base.en"
whisper_size = "base.en"

[audio]
# Microphone, stored by NAME, never by index (indices change when devices
# are plugged in). Empty = the system default. A missing named device
# falls back to the default, and she says so once.
input_device_name = "Microphone Array (Realtek(R) Audio)"
sample_rate = 16000
# 1280 samples = 80 ms at 16 kHz, the frame size openWakeWord expects.
block_size = 1280
# Frames waiting for the wake-word thread. Full = newest frame dropped,
# the audio callback never blocks.
wake_queue_frames = 50
# If the first this-many seconds of audio are all exact zeros, Windows is
# almost certainly blocking the microphone (privacy setting).
silent_check_seconds = 2.0
# When a microphone's native rate is 32 or 48 kHz, JARVIS decimates it to
# 16 kHz itself through a low-pass FIR filter with this many taps.
decimation_filter_taps = 97
# Each
# way of opening a device gets at most this long before the next is tried,
# and at most open_max_attempts ways are tried, so a stuck driver (a
# Bluetooth headset switching profile, a device that has gone) can't hold
# the switch for minutes.
open_timeout_seconds = 4
open_max_attempts = 3
# A click in the microphone list within this long of the list opening is
# ignored: it was meant for whatever was there before the list appeared.
picker_click_guard_seconds = 0.5

[wake_word]
# openWakeWord score (0-1) needed to count as "Hey JARVIS". Keep 0.5 until
# the score log below shows a better value for your microphone.
threshold = 0.5
# Tuning aid: when true, the highest wake-word score of each second is
# written to debug_log_path -- one line of numbers per second (time, peak
# score), never any audio or words. Only while she is asleep (the only
# time the wake word listens).
# Turned OFF (developer); it was on from so
# wake_scores.log filled for tuning. The log file is kept. When on, each line
# also has the second's median microphone loudness (RMS), and each asleep
# utterance adds one timing line (seconds recorded, why it ended, seconds to
# transcribe) -- numbers only, never audio or words (F15).
debug_scores = false
debug_log_path = "jarvis_data/logs/wake_scores.log"

[stt]
# faster-whisper, CPU only (no CUDA dependency).
device = "cpu"
compute_type = "int8"
beam_size = 1
vad_filter = true
condition_on_previous_text = false
# Spoken commands are English (her voice is English). "" would let Whisper guess the language.
language = "en"
# Bias Whisper toward her name (faster-whisper 1.2.1 supports both;
# checked in its transcribe.py). hotwords is added to every 30 s window's
# prompt; initial_prompt only to the first, and a whole sentence there can
# make Whisper invent that sentence on noise, so it stays empty. "" = off.
# Also the app and site names he says most ("Chad
# GPT", "chat chip it", "Virtual Studio"), checked on noise-only clips first
# (benchmark rule: invented text on noise must stay 0).
hotwords = "JARVIS, Chrome, ChatGPT, VS Code, Visual Studio Code, Notepad, YouTube, Spotify, Gmail, GitHub, Priyansh"
initial_prompt = ""
# With app names in hotwords, a clip of just "VS Code" made the
# model repeat "VS Code, VS Code, ..." and fall back to slower retries
# (16-21 s). Without timestamp tokens: 1.03 s, same words. Commands are
# short, so the timestamps were never used.
without_timestamps = true
# R15: the model is loaded on first use and unloaded after this long idle.
unload_after_idle_seconds = 120

[listen]
# After the wake word: recording ends after this much quiet once speech
# has started...
end_silence_seconds = 1.0
# ...or after this long in total...
max_command_seconds = 8.0
# ...or, if no speech starts at all, after this long (LISTEN_TIMEOUT).
no_speech_timeout_seconds = 4.0
# Loudness (RMS of int16 samples) above which a frame counts as speech.
speech_rms_threshold = 500
# Audio kept from just before speech is detected, so the first syllable of
# an utterance isn't cut off (memory only).
preroll_seconds = 0.4
# Noisy microphones (a phrase took ~10 s to act):
# if the room/mic noise sits above speech_rms_threshold, "quiet" never
# arrives and every recording ran the full max_command_seconds. The
# threshold therefore rises to noise_floor_factor x the recent background
# level (the 20th-percentile loudness of the last noise_floor_seconds
# heard outside a recording), never below speech_rms_threshold.
noise_floor_seconds = 3.0
noise_floor_factor = 2.0
# ...but never above this, so a normal speaking voice always counts.
noise_threshold_max_rms = 2500
# While asleep only short phrases matter (wake phrases), so an asleep
# recording is cut at this length instead of max_command_seconds.
max_asleep_utterance_seconds = 4.0
# Waveform bars on the dashboard (LISTENING only).
waveform_bars = 28

[hotkeys]
# System-wide combinations, registered with Windows' RegisterHotKey (it
# reports only these presses and never watches other keys).
# Press-to-talk: one command without the wake word (F2).
push_to_talk = "Ctrl+Shift+Space"
# Stop (R8): top priority from any state. Esc in the window still works.
stop = "Ctrl+Shift+X"

[online]
# R1: every online call. One automatic retry at most, and only after a
# timeout or connection failure, never after a 429.
request_timeout_seconds = 10
max_retries = 1
# After a 429, the service stays off this long, unless the service's own
# retry-after header says otherwise.
rate_limit_cooldown_seconds = 300
# F19: set to true once you have read the online service's
# data-use terms (Groq). Until then every R4 preview of a file says "Online
# service terms not yet checked by you".
terms_checked = false

[length]
# ("explain black hole in one line" got three
# sentences): a length he asks for is told to the model AND enforced on the
# answer (cut to whole sentences).
one_sentence_phrases = ["in one line", "in a line", "one line", "in one sentence", "in a sentence", "one sentence", "a single sentence", "briefly", "in brief", "in short", "short answer", "in a few words", "quickly explain", "tldr", "in a nutshell", "quickly", "quick answer", "short version", "keep it short", "in one go"]
detail_phrases = ["in detail", "in more detail", "in depth", "in full", "explain fully", "fully explain", "step by step", "the long version", "elaborate"]
detail_sentences = 6
# Whisper's mishearings, one letter off, after "in one"/"in a"
# ("in one life", "in one lie") or after "in"/"and" ("and detail").
short_words = ["line", "sentence", "liner"]
detail_words = ["detail", "details", "depth"]
one_sentence_instruction = "Length rule for this answer: reply in exactly ONE sentence, nothing before or after it. This replaces the first-sentence format rule."
detail_instruction = "Length rule for this answer: the developer asked for detail, so reply in up to {count} sentences."

[groq]
# F2 Q&A model -- verified active on Groq's live /models.
model = "openai/gpt-oss-20b"
# gpt-oss-20b spends part of its budget on hidden reasoning before the
# visible answer. 150 was too few: a real "give me 3 tips for studying"
# call stopped with finish_reason "length" after 150 tokens,
# 62 of them reasoning, cutting tip 2 mid-sentence. 600 covers low-effort
# reasoning plus a short spoken answer; the prompt keeps answers short.
answer_max_tokens = 600
# Groq's reasoning_effort for gpt-oss ("low", "medium", "high"; groq SDK
# 1.7.0 accepts it, checked on a live call). Low keeps the
# hidden reasoning small so the budget goes to the answer.
reasoning_effort = "low"
# Added to every online system prompt (approved by the
# developer): her voice starts after the first sentence has been made
# (about 0.3 s + 0.032 s per character on this laptop), and Groq's first
# sentences ran 68-121 characters, so she took 2.1-3.8 s to start. A short
# direct opener starts her in about a second.
# Placed straight after the length rule: at the end of the prompt (first
# try) only 1 of 5 real answers followed it.
opener_rule = "Format rule: your FIRST sentence must be eight words or fewer and directly answer the question; put every detail in the sentences after it. Example: \"Photosynthesis turns sunlight into food. Plants use...\" Never start with a long sentence. The short first sentence must be as accurate as the rest; never shorten it at the cost of being right."

# F18/F19: the shared "chunked summary" (spec, Groq budget).
# About 3,000 tokens of input per request leaves room under 8K tokens/minute.
max_chars_per_request = 12000
# Between chunk requests: about 2 a minute at full size.
chunk_spacing_seconds = 35
# So one task is at most ~48,000 characters and ~2 minutes.
max_chunks_per_task = 4
summary_max_tokens = 400

