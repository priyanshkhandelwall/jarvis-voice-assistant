[claims]
# A typed "got to sleep" went online and Groq answered
# "Going to sleep now. Good night." -- but she never slept. An online answer
# may only talk; JARVIS's own commands do things. Every Groq answer is
# checked locally for a first-person claim of an action (patterns below,
# case-insensitive regular expressions); if one is found, the whole answer
# is replaced. {command} is the command that really does it.
reply_with_command = "I can't do that from here. Try saying '{command}'."
# For actions JARVIS has no command for yet (close apps, reminders, music, volume).
reply_not_built = "I can't do that yet."
# An "open" claim suggests "open <app>" only when a known app or
# site is named in what HE said ("OpenNote Pad" got "open
# onenote"); otherwise just this.
reply_no_command = "I can't do that from here."
# Added to every online system prompt.
prompt_rule = "You can only answer in words. Never say you have done, are doing or will now do any action, such as going to sleep, opening or closing apps or websites, searching, remembering something, setting a reminder or timer, playing music or changing settings. If asked to do one, say plainly that you can't do it from here. Never promise a reminder, a schedule change or a settings change, and never ask for permission or confirmation to do one. You cannot see the developer's camera, webcam or screen: never say you can see, view, watch or read them; if asked what you can see, say: Ask me 'what do you see' and I'll look. Never say where an object near him is (left, right, in front, behind, on the desk) or whether something is there or visible: you have not seen it; say: Ask me 'what do you see' and I'll look. You know nothing about the developer's own life: never state his personal facts, plans, deadlines, appointments or schedule, the weather or forecast anywhere, or the time, from your own knowledge; if asked, say you don't know."
# "I need your permission to adjust the volume" / "I will adjust
# the reminder". A settings claim suggests the command that really does it.
[claims.settings_commands]
volume = "set the volume to 50"
sound = "set the volume to 50"
brightness = "set the brightness to 50"
wifi = "turn Wi-Fi off"
"wi-fi" = "turn Wi-Fi off"

[[claims.rules]]
# ("Where is the cap? Left or right" -> Groq: "The cap is
# on the left."). Positions or visibility of things near him, in answer to a
# visual question: Groq never saw them. Checked only when he asked one.
name = "sees"
when_asked = '''\bwhere(?:'s| is| are)\b|\bleft or right\b|\bright or left\b|\bis there an?\b|\bcan you see\b|\bdo you see\b|\bin front of (?:me|you)\b'''
pattern = '''\b(?:it|they|the [a-z][a-z ]{0,25}?|your [a-z][a-z ]{0,25}?)\s+(?:is|are|'s)\s+(?:(?:on|to|at)\s+(?:the\s+|your\s+|my\s+)?(?:left|right)|in front of|behind|next to|on (?:the|your) desk)\b|\bi (?:can )?(?:see|spot|notice) (?:a|an|the|your|it|that)\b|\b(?:yes|no),? there(?:'s| is| are)\b|\bthere(?:'s| is| are) (?:a|an|no|one|two)\b[^.?!]{0,40}\b(?:in front of you|on (?:the|your) desk|near you|next to you|beside you)'''
reply = "I can't see that from here. Ask me 'what do you see' and I'll look."

[[claims.rules]]
name = "sleep"
pattern = '''\b(?:(?:i'?m|i am)\s+)?going to sleep\b|\b(?:i'?m|i am|i'?ll|i will)\s+(?:go(?:ing)?\s+)?(?:off\s+)?to\s+sleep\b|\b(?:entering|switching (?:to|into)|activating)\s+sleep\s+mode\b|\bsleep mode (?:is )?(?:on|activated|enabled)\b|\b(?:i'?m|i am)\s+(?:now\s+)?(?:asleep|sleeping)\b|\b(?:(?:sure|okay|ok|of course|absolutely|yes)[,!.]?\s+)?(?:i\s+can|i'?m\s+(?:ready|able|going|about)\s+to|i\s+am\s+(?:ready|able|going|about)\s+to|i'?ll|i\s+will|let\s+me|i\s+(?:just\s+)?need\s+to)\s+(?:now\s+|go\s+ahead\s+and\s+|quickly\s+)?(?:go\s+to\s+sleep|sleep|switch\s+(?:to|into)\s+sleep)'''
command = "go to sleep"

[[claims.rules]]
name = "open"
pattern = '''\b(?:i(?:'ve| have)?\s+(?:just\s+)?(?:opened|launched|started up|started)\s+|(?:i'?m|i am)\s+(?:now\s+)?(?:opening|launching)\s+|(?:^|[.!]\s+)(?:opening|launching)\s+|(?:(?:sure|okay|ok|of course|absolutely|yes)[,!.]?\s+)?(?:i\s+can|i'?m\s+(?:ready|able|going|about)\s+to|i\s+am\s+(?:ready|able|going|about)\s+to|i'?ll|i\s+will|let\s+me|i\s+(?:just\s+)?need\s+to)\s+(?:now\s+|go\s+ahead\s+and\s+|quickly\s+)?(?:open|launch|start(?:\s+up)?|pull\s+up|bring\s+up|fire\s+up)\s+)(?:up\s+)?(?:the\s+|your\s+)?(?P<object>[a-z0-9][a-z0-9 .+#-]{0,30}?)(?=\s+(?:for you|now|right away|app|for|on|in)\b|[.!,]|$)'''
command = "open {object}"

[[claims.rules]]
name = "search"
# Only checked on plain answers: a live answer really did search.
pattern = '''\b(?:i(?:'ve| have)?\s+(?:just\s+)?(?:searched|looked (?:it |that )?up|googled|checked online)|(?:i'?m|i am)\s+(?:now\s+)?(?:searching|looking (?:it |that )?up)|(?:(?:sure|okay|ok|of course|absolutely|yes)[,!.]?\s+)?(?:i\s+can|i'?m\s+(?:ready|able|going|about)\s+to|i\s+am\s+(?:ready|able|going|about)\s+to|i'?ll|i\s+will|let\s+me|i\s+(?:just\s+)?need\s+to)\s+(?:now\s+|go\s+ahead\s+and\s+|quickly\s+)?(?:search|look (?:it |that |this )?up|check online|google))\b'''
command = "search for {question}"

[[claims.rules]]
name = "page"
# A glued "OpenZorblex.com" went online and Groq said
# "openzorblex.com loads now. The homepage shows a clean layout..." -- nothing
# was opened. A page described as loaded or open in front of him is a claim.
pattern = '''\b[a-z0-9-]+\.(?:com|org|net|io|ai|co|au|in|uk)\s+(?:(?:is\s+)?now\s+(?:loaded|loading|open|opened|up)|(?:loads|opens|is loading|is open|is up)\s+now|has (?:now\s+)?(?:loaded|opened))\b|\b(?:web ?site|web ?page|home ?page|page|site|tab)\s+(?:is\s+)?now\s+(?:open|opened|loaded|loading|up|showing|shows|displays)\b|\b(?:web ?site|web ?page|home ?page|page|site|tab)\s+(?:loads|is open|is loaded|has loaded|has opened|opens)\s+now\b'''
command = ""
reply = "I can't open web pages from here. Say 'open', then the site's name."

[[claims.rules]]
name = "see"
# "What can you see" got "I can view your webcam feed..." online.
pattern = '''\bi\s+(?:can|am able to|'m able to)\s+(?:also\s+)?(?:see|view|watch|read|access|look at|identify)\s+(?:what(?:'s| is)\s+on\s+)?(?:your|the)\s+(?:webcam|camera|screen|monitor|desktop|display)|\bi\s+(?:can|could)\s+see\s+(?:what(?:'s| is)\s+on\s+)?your\s+screen|\bi\s+(?:can\s+)?(?:see|view)\s+(?:you|your room|your face)\b'''
command = ""
reply = "I can't see anything from here. Ask me 'what do you see' and I'll look."

[[claims.rules]]
name = "close"
pattern = '''\b(?:i(?:'ve| have)?\s+(?:just\s+)?(?:closed|shut down|quit)|(?:i'?m|i am)\s+(?:now\s+)?(?:closing|shutting down)|(?:^|[.!]\s+)closing|(?:(?:sure|okay|ok|of course|absolutely|yes)[,!.]?\s+)?(?:i\s+can|i'?m\s+(?:ready|able|going|about)\s+to|i\s+am\s+(?:ready|able|going|about)\s+to|i'?ll|i\s+will|let\s+me|i\s+(?:just\s+)?need\s+to)\s+(?:now\s+|go\s+ahead\s+and\s+|quickly\s+)?(?:close|shut\s+down|quit|exit))\b'''
command = ""

[[claims.rules]]
name = "remember"
pattern = '''\b(?:(?:sure|okay|ok|of course|absolutely|yes)[,!.]?\s+)?(?:i\s+can|i'?m\s+(?:ready|able|going|about)\s+to|i\s+am\s+(?:ready|able|going|about)\s+to|i'?ll|i\s+will|let\s+me|i\s+(?:just\s+)?need\s+to)\s+(?:now\s+|go\s+ahead\s+and\s+|quickly\s+)?(?:remember|keep (?:that|it|this) in mind|make a note|save (?:that|it|this))|\bi(?:'ve| have)\s+(?:saved|noted|stored|remembered|made a note)|\bgot it,?\s+i'?ll remember\b'''
command = ""
# F10 is built: remembering is her own local command.
reply = "I can't do that from here. Say 'remember that', then what you want me to remember."

[[claims.rules]]
name = "reminder"
pattern = '''\b(?:i(?:'ve| have)?\s+(?:just\s+)?set (?:a |an |the |your )?(?:reminder|timer|alarm)|(?:reminder|timer|alarm) (?:is |has been )?set\b|i'?ll remind you|(?:(?:sure|okay|ok|of course|absolutely|yes)[,!.]?\s+)?(?:i\s+can|i'?m\s+(?:ready|able|going|about)\s+to|i\s+am\s+(?:ready|able|going|about)\s+to|i'?ll|i\s+will|let\s+me|i\s+(?:just\s+)?need\s+to)\s+(?:now\s+|go\s+ahead\s+and\s+|quickly\s+)?(?:set|create|start) (?:a |an |the |your )?(?:reminder|timer|alarm)|(?:(?:sure|okay|ok|of course|absolutely|yes)[,!.]?\s+)?(?:i\s+can|i'?m\s+(?:ready|able|going|about)\s+to|i\s+am\s+(?:ready|able|going|about)\s+to|i'?ll|i\s+will|let\s+me|i\s+(?:just\s+)?need\s+to)\s+(?:now\s+|go\s+ahead\s+and\s+|quickly\s+)?remind you)'''
command = ""

[[claims.rules]]
name = "play"
pattern = '''\b(?:i'?m|i am)\s+(?:now\s+)?playing\s+(?:some\s+|your\s+)?(?:music|songs?|playlist|track|video)|\bnow playing\b|\bi(?:'ve| have) (?:started|put on) (?:playing|some)|(?:(?:sure|okay|ok|of course|absolutely|yes)[,!.]?\s+)?(?:i\s+can|i'?m\s+(?:ready|able|going|about)\s+to|i\s+am\s+(?:ready|able|going|about)\s+to|i'?ll|i\s+will|let\s+me|i\s+(?:just\s+)?need\s+to)\s+(?:now\s+|go\s+ahead\s+and\s+|quickly\s+)?(?:play|put on)\s+(?:some\s+|your\s+|a\s+|the\s+)?(?:music|songs?|playlist|track|video)'''
command = ""

[[claims.rules]]
name = "change"
# "I will adjust the reminder", "I need your permission to adjust
# the volume", "I can adjust that for you", "Let me update your schedule".
pattern = '''\bi\s+need\s+your\s+(?:permission|approval|confirmation)\s+to\b|\b(?:i'?ll|i\s+will|i\s+can|i\s+could|i'?m\s+going\s+to|i\s+am\s+going\s+to|i\s+shall|let\s+me|i'?d\s+be\s+happy\s+to)\s+(?:now\s+|go\s+ahead\s+and\s+|quickly\s+|also\s+)?(?:adjust|update|set|change|modify|reschedule|move|schedule|increase|decrease|lower|raise|turn\s+(?:up|down|on|off))\b|\bi(?:'ve|\s+have)\s+(?:just\s+)?(?:adjusted|updated|rescheduled|modified)\b'''
command = "@settings"

[[claims.rules]]
name = "settings"
pattern = '''\bi(?:'ve| have)?\s+(?:just\s+)?(?:turned|set|changed|muted|unmuted)\s+(?:the\s+|your\s+)?(?:volume|brightness|wi-?fi|sound)|\b(?:volume|brightness) (?:is |has been )?(?:now )?(?:set|turned|changed)|(?:(?:sure|okay|ok|of course|absolutely|yes)[,!.]?\s+)?(?:i\s+can|i'?m\s+(?:ready|able|going|about)\s+to|i\s+am\s+(?:ready|able|going|about)\s+to|i'?ll|i\s+will|let\s+me|i\s+(?:just\s+)?need\s+to)\s+(?:now\s+|go\s+ahead\s+and\s+|quickly\s+)?(?:turn|set|change|mute|unmute|adjust)\s+(?:up\s+|down\s+)?(?:the\s+|your\s+)?(?:volume|brightness|wi-?fi|sound)'''
command = "@settings"

[memory]
# F10 long-term memory (the developer's decisions): she
# remembers ONLY what he tells her to, by voice or typed command (no
# dashboard panel); it is never sent online; "forget everything" needs two
# confirmations (L4). Stored in the data folder, never submitted (R18).
path = "jarvis_data/memory.json"
max_items = 500
# "what do you know about Y": at most this many matches, newest first.
recall_max = 3
# "what do you remember": this many newest are spoken; all are listed in Live Activity.
list_spoken_max = 5
# A correction ("actually my exam is on tuesday") updates the stored item
# that shares at least this share of its keywords (and no other item shares
# as many); otherwise it is stored as new.
correction_min_overlap = 0.5
# "actually" + fewer words than this is not a correction ("actually no").
min_correction_words = 3
# Dropped from the start of what was said before matching.
lead_filler = ["please", "can", "could", "would", "will", "you", "hey", "ok", "okay", "so", "and", "also", "sir"]
remember_prefixes = ["remember that", "remember", "don't forget that", "don't forget", "do not forget that", "do not forget", "dont forget that", "dont forget", "make a note that", "note that"]
correction_prefixes = ["actually", "correction", "no wait", "wait actually"]
# ("Actually, it is on Wednesday now" was stored as "it
# is on wednesday"). A sentence opening with one of these pronouns and then
# one of the verbs, within pronoun_window_seconds of a memory being saved or
# recalled, is about THAT memory's subject ("it" -> "my meeting"): updated.
# Lead words before the pronoun ("actually", "no", "oh") are dropped.
correction_pronouns = ["it", "it's", "its", "that", "that's", "this", "this's", "it'll"]
pronoun_verbs = ["is", "was", "has", "had", "changed", "moved", "got", "will", "now", "became", "becomes", "isn't", "wasn't", "on", "at", "in"]
pronoun_lead_words = ["actually", "correction", "no", "nope", "wait", "oh", "sorry", "update", "but", "and", "so", "well", "um", "uh", "ok", "okay"]
# ...and only with one of these somewhere in it ("it is cold today" is no correction).
pronoun_signal_words = ["actually", "correction", "no", "nope", "wait", "sorry", "update", "updated", "changed", "moved", "now",
                        "instead", "anymore", "rescheduled", "postponed", "not"]
pronoun_window_seconds = 120
recall_prefixes = ["what do you know about", "what do you remember about", "what did i tell you about", "what have i told you about", "do you remember anything about", "tell me what you know about", "do you know anything about"]
list_phrases = ["what do you remember", "what do you know", "what have i told you", "what did i tell you", "what do you know about me", "list what you remember", "list your memories", "tell me what you remember"]
forget_all_phrases = ["forget everything", "forget everything i told you", "forget everything you know", "forget all", "forget all of it", "delete all memories", "delete all your memories", "clear your memory", "wipe your memory", "erase your memory", "forget all memories"]
# After a forget-all phrase, only these words may follow and it is
# still everything ("forget everything you remember about me").
forget_all_tail_words = ["you", "remember", "remembered", "know", "about", "me", "i", "told", "said", "have", "has", "ever", "stored",
                         "saved", "of", "it", "in", "your", "memory", "memories", "that", "this", "from", "now", "please", "the", "things"]
forget_prefixes = ["forget about", "forget that", "forget what i said about", "forget"]
# "forget it" means "never mind", not "forget the item called it".
not_forget_targets = ["it", "that", "this", "about it", "about that", "it then", "everything else"]
not_corrections = ["never mind", "nevermind", "forget it", "it doesn't matter", "doesn't matter", "no thanks", "not really"]
question_starts = ["what", "who", "when", "where", "why", "how", "which", "is", "are", "can", "could", "do", "does", "did", "will", "should"]
# Ignored when matching an item to a topic.
stop_words = ["a", "an", "the", "my", "your", "i", "me", "you", "is", "are", "was", "were", "be", "on", "in", "at", "to", "of", "for", "and", "or", "it", "that", "this", "about", "with", "from", "by", "as", "has", "have", "had", "will", "am", "do", "does", "did", "so", "its", "it's", "i'm", "we", "our", "they", "their", "he", "she", "his", "her", "there", "what", "anything", "something", "thing", "things", "stuff", "actually", "really", "just", "also", "then", "now", "not"]

