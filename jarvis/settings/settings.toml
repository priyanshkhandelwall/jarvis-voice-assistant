[web]
# F16 Stage 1: live questions via Groq's browser_search tool.
# Whether a question needs the web is decided HERE, locally, never by the
# model: a question is "live" if it has one of these words or phrases, a
# time word, or a year from this year on. Everything else gets the plain
# answer (no tool, far fewer tokens). Matched as whole words, any case.
live_words = ["score", "scores", "scored", "scorecard", "match", "matches", "result", "results", "won", "win", "wins", "winner", "who won", "fixture", "fixtures", "playing", "standings", "ladder", "news", "headline", "headlines", "latest", "update", "updates", "happening with", "going on with", "price", "prices", "stock", "stocks", "share price", "election", "release date", "live", "weather warning", "search for", "search online", "look up",
              # "When is the next Formula One race?" was answered without a search and
              # Groq made up a date. A schedule or a "who is the current ..." is live information.
              "when is the next", "when's the next", "whens the next", "next race", "next game", "next match", "next episode",
              "upcoming", "schedule", "who is the current", "who's the current", "whos the current", "current president",
              "current prime minister", "current ceo", "current champion"]
time_words = ["today", "tonight", "yesterday", "this week", "this weekend", "last night", "right now", "currently", "at the moment", "this morning", "this afternoon", "this evening"]
# Free-plan budget (Groq gpt-oss-20b): 200,000 tokens/day is the published
# figure but is unverified for the free key; 1,000 requests/day and 8,000
# tokens/minute are confirmed by Groq's own response headers.
# Every Groq call (live and plain) is added to a local daily ledger; live
# searches stop once this many tokens are used today (local date).
daily_token_budget = 150000
# Before a live search: if Groq's last reply said fewer than this many
# tokens are left this minute, wait for the reset when it is at most
# max_wait_seconds away (Stop still works), otherwise say so.
min_tokens_per_call = 4000
max_wait_seconds = 15
# Room for hidden reasoning plus a two-sentence answer.
answer_max_tokens = 1500
# Local ledger (data folder, R18): today's date and tokens used. Numbers only.
usage_path = "jarvis_data/groq_usage.json"
# Added to the system prompt for a live search. Keeps one search to about
# 2,800 tokens (measured: 2,475-9,840 without it, 2,802 with it).
# Accuracy sentence added On she said West Indies "chased"
# a total they had actually set (they won by runs, so they batted first).
live_instructions = "Use browser_search exactly once and open at most ONE result page. Answer in at most two short spoken sentences with no markdown, and say which website the answer comes from. Report results exactly as the source states; don't infer who batted first or chased unless the source says so. State only what the page you opened says, never details you worked out yourself. If the page gives a date for the result, say it. If the results do not answer the question, say so plainly instead of guessing. Never name the search tool or any service you used (for example Exa or Groq); name only the website the answer came from."
# She says what was actually searched (taken from the search tool's own
# request, not from the model's text), so a mishearing is obvious.
searched_for_text = "I searched for {query}."
# Never said aloud: a sentence naming one of these is dropped from an answer (R3).
never_spoken_names = ["exa", "exa.ai", "groq", "gpt-oss", "openai/gpt-oss-20b", "browser_search"]
# (Live Activity "read 1 page: exa.ai" for the Bitcoin
# price): hosts of the search provider itself, never shown as a page read.
# A real site inside such a link (?url=...) is shown instead; otherwise only
# the count ("read 1 page").
provider_hosts = ["exa.ai", "groq.com", "openai.com"]
budget_used_up_text = "Today's web-search allowance is used up. I can answer without live information, or try again tomorrow."
minute_limit_text = "The online allowance for this minute is used up. Try again in {seconds} seconds."
nothing_found_text = "I couldn't find anything live about that."
# Recency. On "the score of India vs West Indies" was
# answered with a match from 1 March, with no date said. Now JARVIS -- not
# the model -- adds today's local date to every live question, in the words
# sent (so Live Activity shows them), and asks for the most recent result
# when the question has one of these words.
recency_words = ["latest", "last", "today", "tonight", "yesterday", "score", "scores", "news", "headline", "headlines", "recent", "current", "currently", "right now", "this week", "result", "results", "who won"]
date_note = "{question} (today is {date})"
recency_note = "{question} (most recent as of {date})"
# The result's date is read by JARVIS from the page the model opened (its
# first date, never a future one), within this many characters of the page.
date_search_chars = 3000
# Said after every live answer: the date of the result. For a recency
# question whose result is older than stale_days, the stale line instead.
stale_days = 7
result_date_text = "That result is from {date}."
stale_result_text = "The most recent result I found is from {date}."
no_date_text = "The page I read didn't show a date for this result."

