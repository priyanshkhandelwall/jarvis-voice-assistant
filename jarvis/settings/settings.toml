[file_finder]
# F4: minimum score (0-1) for a filename to count as a likely match. Was 0.5,
# which let "resume" match "resource.pyi"/"resample.pyi" (fuzzy ratio 0.71)
# and, with the leftover word "my" from "find my resume", 0.59.
match_threshold = 0.8
# Below an exact / whole-word / substring hit, a name only scores if its
# fuzzy similarity to the query is at least this -- typo tolerance, not
# "different word with similar letters".
fuzzy_min_ratio = 0.85
# Spoken filler removed from a query before matching ("find my resume").
query_filler_words = ["my", "the", "a", "an", "file", "files", "folder", "folders", "document", "documents", "for", "me", "please", "called", "named", "of",
                      # "Find UM, my budget stuff please" searched for "um budget stuff" (Eigen's UmfPack headers).
                      "um", "umm", "uh", "er", "erm", "hmm", "stuff", "things", "thing", "some", "any", "all", "whatever"]
# "find X folder" searches folder names only; otherwise files and folders.
folder_words = ["folder", "folders", "directory"]
# Folders whose name starts with "." (.vscode, .codex, .cache ...) hold tool
# internals, not the developer's own files -- skipped while indexing.
skip_hidden_directories = true
# Office lock and temporary files (open documents leave these next to them).
skip_file_prefixes = ["~$", ".~lock.", "~wrl"]
# ("Find Budget" -> 13 matches, mostly JARVIS's own
# backup copies of budget.py): files ending like this are never indexed.
skip_file_suffixes = [".bak"]
# JARVIS's own folders, relative to the project root: never
# walked, so "find" only lists his files. Paths, not bare names -- a folder
# of his called "models" elsewhere is still found.
excluded_project_folders = ["docs/backups", "docs/spec-backups", "test_runs", "venv", "models", "jarvis_data", "submission",
                            # "find budget" offered the e2e run's groq_budget.json.
                            "tests/e2e/results"]
# ("find my report" listed make_report.py,
# final_report.rmd and final_report.html next to Report.pdf). His documents
# come first; code and build files are listed only when he names their kind
# ("find the python file report") or when no document matches. Then exact
# names, whole-word names, partial names; then the newest modified.
document_suffixes = [".pdf", ".docx", ".doc", ".xlsx", ".xls", ".csv", ".pptx", ".ppt", ".txt", ".md", ".rtf", ".odt", ".ods", ".odp",
                     ".jpg", ".jpeg", ".png", ".gif", ".bmp", ".heic", ".webp", ".tif", ".tiff"]
code_suffixes = [".py", ".pyi", ".pyw", ".rmd", ".r", ".html", ".htm", ".js", ".ts", ".jsx", ".tsx", ".json", ".ipynb", ".log", ".css",
                 ".java", ".c", ".cpp", ".h", ".hpp", ".cs", ".go", ".rs", ".xml", ".yml", ".yaml", ".toml", ".ini", ".cfg", ".sh",
                 ".bat", ".ps1", ".sql", ".tex", ".lock", ".map", ".o", ".obj", ".class", ".pyc"]
# A kind he names, and the suffixes it means (the word is not part of the name searched for).
type_words = { python = [".py", ".pyw", ".ipynb"], py = [".py", ".pyw"], notebook = [".ipynb"], jupyter = [".ipynb"], rmarkdown = [".rmd"], rmd = [".rmd"], html = [".html", ".htm"], webpage = [".html", ".htm"], javascript = [".js", ".jsx"], json = [".json"], log = [".log"], code = [".py", ".pyw", ".ipynb", ".rmd", ".r", ".js", ".ts", ".jsx", ".tsx", ".java", ".c", ".cpp", ".h", ".cs", ".go", ".rs", ".html", ".css", ".sql", ".sh", ".ps1", ".bat"], script = [".py", ".pyw", ".r", ".js", ".ps1", ".bat", ".sh"], source = [".py", ".pyw", ".r", ".rmd", ".js", ".ts", ".java", ".c", ".cpp", ".h", ".cs", ".go", ".rs"] }
# While a search scans the index it reports the running match count to the
# activity panel, at most this often (seconds).
search_progress_interval_seconds = 0.15
# DEFAULT (Section 6): a background-refreshed index, not a full scan per
# search, because a slow secondary drive would make per-search scanning
# too slow. How often the index rebuilds, in seconds.
refresh_interval_seconds = 300
# How many candidates to show when there's more than one match.
max_results_shown = 5
# Directory names skipped entirely while building the index (case
# insensitive) -- noisy, not personal files, and often huge (Windows,
# Program Files) or slow to traverse for no benefit (node_modules, .git).
excluded_directory_names = [
    "windows", "program files", "program files (x86)", "programdata",
    "$recycle.bin", "node_modules", ".git", "__pycache__", "venv",
    ".venv", ".cache", "appdata", "site-packages",
]
# The typed/spoken phrase that starts a search, and how "open <selection>"
# is recognised for picking one of several listed matches.
find_command_prefix = "find "
verify_timeout_seconds = 6.0
verify_poll_interval_seconds = 0.25
# "open number two" picked budget.py, and
# Windows' "open" for .py is py.exe -- the script RAN. Opening a file must never
# run code: files with these extensions are shown, selected, in File Explorer.
runs_when_opened = [".py", ".pyw", ".pyz", ".bat", ".cmd", ".ps1", ".psm1", ".vbs", ".vbe", ".js", ".jse", ".wsf", ".wsh",
                    ".hta", ".exe", ".com", ".scr", ".msi", ".msp", ".cpl", ".reg", ".jar", ".appref-ms", ".application",
                    ".pif", ".sct", ".inf", ".ws", ".msc"]
shown_not_run = "{name} is a program or script, and opening it would run it, so I've shown it in File Explorer instead."
# macOS: these also run when opened, and Finder replaces File Explorer.
runs_when_opened_mac = [".sh", ".command", ".tool", ".app", ".pkg", ".scpt", ".workflow"]
shown_not_run_mac = "{name} is a program or script, and opening it would run it, so I've shown it in Finder instead."
# A file no app is set to open (no extension, an unknown one): Windows would
# show its "Pick an app" dialog and she would wait on it.
shown_no_app = "No app is set to open {name}, so I've shown it in File Explorer instead."
shown_no_app_mac = "No app is set to open {name}, so I've shown it in Finder instead."

