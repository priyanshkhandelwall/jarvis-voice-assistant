# JARVIS settings (R17): every tunable number lives here, not in code.
# Edit this file to change behaviour without touching code.

[controller]
# How long a permit stays valid after being issued, in seconds.
permit_timeout_seconds = 30
# F7 Section 5: how long a pending confirmation (L2/L3/L4) stays valid,
# from when the preview was first issued. Section 5's own starting value
# is 60 seconds.
confirmation_timeout_seconds = 60
# How often the controller thread checks for a Stop request, in seconds.
stop_poll_interval_seconds = 0.05
# How long the controller waits for a new event before looping again, in seconds.
queue_get_timeout_seconds = 0.05
# If a transition listener (e.g. F5's logbook) takes longer than this to
# run, log a warning -- it runs on the controller's single worker thread,
# so slowness here delays every subsequent event, including Stop.
transition_listener_warn_seconds = 0.05

[dashboard]
# R8/4.2: bounded queue between the controller's worker thread and the
# dashboard's own thread. If the dashboard falls behind, the oldest
# queued UI message is dropped rather than ever blocking the controller.
ui_queue_max_size = 200
# How often the dashboard's own thread polls the bridge and gauges, in
# seconds. Caps the UI refresh rate (R15).
refresh_interval_seconds = 0.05
# Gauges (CPU/RAM/Disk) and network rates only need to move a couple of
# times a second; the fast loop above exists so state changes show up
# within a tick, not to redraw these 20x/s.
slow_panels_interval_seconds = 0.5
# How often the STOP button's breathing glow flips (its own animation is
# 600ms, so flipping faster than that just restarts it before it finishes).
stop_glow_interval_seconds = 0.6
# R15: warn when free memory drops below this percentage.
low_memory_warning_free_percent = 15
# F8/F9: a capture can be shorter than one refresh tick; its Sensor Array
# row stays on at least this long after it started, so it is never missed.
sensor_on_min_seconds = 1.5
# R15: the RAM gauge turns red at once, but the warning (shown and spoken)
# waits for this many slow ticks in a row below the threshold, and is said
# at most once per cooldown.
low_memory_consecutive_samples = 3
low_memory_warning_cooldown_seconds = 300
low_memory_warning_text = "Memory is running low, only {free} percent free. Close apps you don't need so the laptop doesn't slow down."
# Locked design step: resizable native window, minimum size
# only -- no fixed dimensions.
window_min_width = 1100
window_min_height = 700
# "nominal" vs "elevated" status word thresholds for the sensor tiles
# (CPU/RAM/Disk), percent used. Developer hasn't set specific numbers --
# reasonable defaults, tunable here without touching code (R17).
cpu_elevated_percent = 75
ram_elevated_percent = 80
disk_elevated_percent = 85
# How many log rows the activity feed keeps on screen (R15: bounded).
activity_feed_max_rows = 200
# How long each JARVIS state stays on the central status pill. A typed
# command walks WAITING -> LISTENING -> UNDERSTANDING -> SPEAKING -> WAITING
# in a few milliseconds -- far too fast to read -- so each state is held
# briefly. History: 0.4s per state was too laggy (1.4-2.3s of padding);
# 0.03s was too fast to read. Now: up to `max` per state (readable), but a
# longer chain is squeezed so the whole walk fits `chain_budget`, never
# below `min`. (Each on-screen hold measures about 40ms longer than the
# setting: the 50ms refresh tick plus render time.) Delays only what is drawn, never the controller itself.
state_dwell_max_seconds = 0.25
state_dwell_min_seconds = 0.13
state_chain_budget_seconds = 0.7
# Empty space above the Live Activity panel's divider, in logical px. Was
# 100; 56 gives the activity list about 44px (~3 lines) more height.
live_activity_top_spacer = 56
# F2 missing-setup notes (voice output) shown once at startup, then they fade.
startup_notice_seconds = 30
# A spoken notice (low memory, a missing setup) waits at most this long for her
# to be idle; it is always shown at once, and skipped aloud if she stays busy.
notice_wait_seconds = 60
# Refresh-loop errors only (never per-tick data). Relative to the project
# root, inside the data folder (excluded from Git, R18); emptied each launch.
diag_log_path = "jarvis_data/logs/dashboard_diag.log"

[interpreter]
# Spoken/shown when nothing matched (UNDERSTAND_FAILED).
not_understood_text = "I don't understand that yet."
#  A numbered list (files, apps, places, memories)
# stays pickable for this long, through unrelated commands ("what time is
# it"), until something is picked, a new list is shown, Stop or sleep.
pick_valid_seconds = 120
# A pick ("open number one", "open file number 1", "second") with no list
# pending: answered locally, never an app search for "number one".
no_list_text = "There's no list to pick from right now. Say 'find' and a file name first."
# The typed/spoken word that means "confirm" (F7, Section 5).
confirm_word = "confirm"
# Removed before the local matchers see a command (the
# words sent online are left as said). Phrases first, then single words.
# Her name is also removed at the start, or at the end after a comma.
filler_phrases = ["can you", "could you", "would you", "will you", "for me", "right now", "i want you to"]
# Whisper's hesitations ("Uhh, why did you Umm do that?") asked "Did you mean...?".
filler_words = ["please", "sir", "kindly", "actually", "just", "now", "pls", "um", "umm", "uh", "uhh", "uhm", "erm", "hmm", "ahh"]
# "This is so annoying, nothing is working, open
# notepad" went online. A command is found anywhere in what was said when one
# of these verbs starts a clause: at the start, after punctuation, or after
# only command_leads words ("can you please open ..."). Verb -> what the local
# matchers see. "how do I open chrome" or "I can't open it" never count.
command_verbs = { "open up" = "open", "pull up" = "open", "bring up" = "open", "fire up" = "open", "load up" = "open", open = "open", launch = "open", start = "open", run = "open", find = "find", track = "track", "start tracking" = "start tracking", "stop tracking" = "stop tracking", "keep track of" = "keep track of", turn = "turn", set = "set", mute = "mute", unmute = "unmute", lock = "lock", restart = "restart", reboot = "reboot", "shut down" = "shut down", shutdown = "shutdown", increase = "increase", decrease = "decrease", lower = "lower", raise = "raise", dim = "dim", enable = "enable", disable = "disable", switch = "switch", volume = "volume", brightness = "brightness", play = "play", summarise = "summarise", summarize = "summarise", read = "read", "what's in" = "what's in", "whats in" = "what's in" }
command_leads = ["can", "could", "would", "will", "you", "u", "please", "pls", "kindly", "just", "now", "and", "then", "so", "ok", "okay", "hey", "i", "want", "need", "to", "go", "ahead", "quickly", "sir", "jarvis", "for", "me", "right", "away", "also",
                 # Whisper's "Shut up" ("Shader, then please open Chrome")
                 "shader", "shutter", "shatter", "shudder"]
# Words right after a verb that mean it isn't a command ("find out who won").
command_not_after = ["out", "up on", "about"]

[filesystem]
# R9: the one shared path check every module must call. Env vars are
# expanded (%USERPROFILE%, %OneDrive%, ...) so this works regardless of
# the actual username or drive layout -- never a hardcoded absolute path.
#
# Anything that CHANGES files (create, write, save, rename, move, copy,
# delete) works only inside these folders. The developer-approved list
# Documents, Downloads, Desktop, and the JARVIS project
# folder itself (added automatically in code, not listed here, since its
# absolute path depends on where the project happens to be checked out).
approved_folders = [
    "%USERPROFILE%\\Documents",
    "%USERPROFILE%\\Downloads",
    "%USERPROFILE%\\Desktop",
]
# Read-only actions (search, open, show) can reach any folder EXCEPT
# these. Developer-approved list: only the Pictures folder
# (Camera Roll/Screenshots are subfolders of it, so protecting Pictures
# itself already covers them -- no password manager or similar data
# exists on this laptop, so nothing else is protected). Also checks the
# OneDrive-redirected Pictures folder, if OneDrive is set up, since that
# is a common alternate location for the same folder.
protected_folders = [
    "%USERPROFILE%\\Pictures",
    "%OneDrive%\\Pictures",
]
# Inside the project, relative to it (R9). Was F16b's own browser profile,
# removed with JARVIS's own browser.
protected_project_folders = []

[app_finder]
# F3: minimum fuzzy-match score (0-1) for a Start Menu shortcut or known
# alias to count as a match. Below this, JARVIS says she can't find it.
match_threshold = 0.55
# A name that matches no app or site this closely (0-1, or the
# same consonants) gets "Did you mean Claude?"; anything less is searched for
# in Chrome ("I couldn't find an app called X, so I've searched for it").
site_guess_ratio = 0.6
not_found_search = "I couldn't find an app called {name}, so I've searched for it in Chrome."
not_found_no_chrome = "I couldn't find an app called {name}."
# Launch only if the best match scores at least this AND is more than
# ambiguity_margin ahead of the next app; otherwise she lists the top 3 and
# asks which one ("vs code" opened Discord).
launch_threshold = 0.75
ambiguity_margin = 0.1
# App names are also
# matched word by word. Two words of at least token_min_length letters are
# the same word when 1 - edits/length is at least token_similarity
# ("virtual" ~ "visual" = 0.71). Shorter words must match exactly.
token_min_length = 5
token_similarity = 0.7
# R12 verification: how long to wait for a new window/process to appear
# after launching, and how often to poll.
verify_timeout_seconds = 6.0
verify_poll_interval_seconds = 0.25
# Windows Store / UWP apps (Camera, Photos, Clock ...) have no Start Menu
# .lnk; they are read from shell:AppsFolder once in the background and kept
# for this long before being read again.
store_apps_cache_seconds = 600
# Said after an "open Chrome and search X" phrasing the F16b search matcher missed.
search_not_built_text = "To search the web, say search and what you want, for example: search best pizza in Sydney."

