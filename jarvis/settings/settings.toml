# when he asks ("any news on my topics", or a briefing he asked for) -- never
# on a wake (removed), a timer or a background thread.
store_path = "jarvis_data/topics.json"
max_topics = 20
max_topic_chars = 60
# URL hashes remembered per topic (oldest dropped first). Headline text is
# never stored.
max_seen_per_topic = 200
max_headlines_per_topic = 3
# A spoken headline is cut to this many words (whole words, no "...").
title_max_words = 14
# Phrases, as said after the interpreter's clean-up. Longest first is applied
# in code. "start tracking X", "track X" ...
add_prefixes = ["start tracking", "keep track of", "track", "monitor topic", "follow the news on", "follow the news about", "follow news on"]
remove_prefixes = ["stop tracking", "stop monitoring", "stop following", "untrack", "don't track", "do not track", "dont track"]
list_phrases = ["what am i tracking", "what i am tracking", "what topics am i tracking", "which topics am i tracking", "what are my topics", "list my topics", "show my topics", "what topics do i track", "what do i track"]
check_phrases = ["any news on my topics", "any news about my topics", "any news for my topics", "check my topics", "check my topics now", "check topics", "news on my topics", "what's new on my topics", "whats new on my topics", "any updates on my topics", "anything new on my topics"]
# ("Track, Indian Cricut" was added next to "indian
# cricket"; "stop tracking indian gritted" found nothing). A topic said is the
# same as a tracked one when it has as many words and each word is within
# fuzzy_max_distance edits of the tracked word after sound-alike letters are
# folded together (c/k/g/q, t/d, b/p, f/v, s/z) and doubled letters collapsed,
# with the same first sound. Words shorter than fuzzy_min_chars must match exactly.
fuzzy_max_distance = 2
fuzzy_min_chars = 4
sound_alike = ["ckgq", "td", "bp", "fv", "sz"]
# "stop tracking A and B": each part is removed.
list_separators = ["and", "plus", "also", "as well as"]
# "stop tracking" alone asks which topic; his answer counts for this long.
which_seconds = 30
# Not a topic: "track it", "stop tracking that".
not_topics = ["it", "that", "this", "them", "my topics", "topics", "everything", "my order", "my phone", "my location"]

[topics.replies]
added = "Tracking {topic}."
already = "I'm already tracking {topic}."
full = "You're tracking {max} topics, the most I keep. Say stop tracking and a topic first."
too_long = "That topic is too long. Keep it under {max} characters."
removed = "Stopped tracking {topic}."
removed_and_missing = "Stopped tracking {topic}. I'm not tracking {missing}."
which_out_of_range = "There are only {count} topics. Say a number from 1 to {count}."
which_remove = "You're tracking {topics}. Which one should I stop tracking?"
not_tracked = "I'm not tracking {topic}."
list_none = "You aren't tracking any topics. Say track and a topic, for example track Indian cricket."
list_one = "You're tracking one topic: {topics}."
list_many = "You're tracking {count} topics: {topics}."
check_none = "You aren't tracking any topics yet. Say track and a topic first."
new_one = "1 new headline on {topic}: {titles}."
new_many = "{count} new headlines on {topic}: {titles}."
nothing_new_one = "Nothing new on {topics}."
nothing_new_all = "No new headlines on your topics."
some_failed = "I couldn't check {topics}."
cannot_reach = "I can't reach the news right now. Check your internet connection, then try again."
cooling = "The free limit for news is reached; it is off until {until}."
service_error = "The news service didn't answer properly, so I couldn't check your topics. Try again in a few minutes."
write_failed = "I couldn't save your topics. Check that the JARVIS folder isn't read-only, then try again."
corrupt = "Your topics file was damaged, so I kept it as {name} and started a new list."
sensitive = "I won't send that online. It looks like a {kind}."

[news]
# F20/F21 news, through the shared online helper (R1: timeout, one retry,
# 429 cooldown). Parsed with defusedxml. Terms checked (spec
# F20 "Source"): Bing News search RSS allows use "within an RSS aggregator
# for your personal, non-commercial use"; BBC (terms 15, v1.8) allows
# personal use credited "BBC News"; NPR allows its content feeds "on your
# personal site or application". The Guardian's terms forbid any automated
# program for reading its content, so its feed is not used.
# topic_source: "bing" = one Bing News search feed per topic (default);
# "feeds" = the general feeds below, filtered by the topic's words.
topic_source = "bing"
topic_search_url = "https://www.bing.com/news/search?q={query}&format=rss"
# Older headlines are not "new", whatever the feed returns.
topic_max_age_hours = 48
# Between two topic requests (Stop is checked in between).
request_spacing_seconds = 1.5
general_feed_urls = [
    "https://feeds.bbci.co.uk/news/rss.xml",
    "https://feeds.npr.org/1001/rss.xml",
]
# Shown and spoken as the source of a general headline (BBC's terms ask for
# the "BBC News" credit).
feed_names = { "feeds.bbci.co.uk" = "BBC News", "feeds.npr.org" = "NPR" }

[briefing]
# F21 morning briefing (built). Runs ONLY when he asks
# ("brief me", "morning briefing", "give me my briefing" -- on_demand_phrases
# below, or the router's "briefing" intent). The first-wake
# trigger (and its enabled flag, state file and standing approval) was
# removed -- nothing starts by itself. Order: greeting -> date -> weather
# (F16a, the default city) -> top general headlines -> F20's topic headlines.
# Stop or "skip" ends it at once. Never a recap of earlier sessions (F10).
# Spoken length cap, estimated from word count: about 30 seconds.
max_spoken_seconds = 30
words_per_second = 2.5
max_general_headlines = 3
# A spoken general headline is cut to this many words.
general_title_max_words = 10
include_weather = true
include_headlines = true
include_topics = true
# "briefme", "brief man": how Whisper heard "Brief me" in the e2e run (F3).
on_demand_phrases = ["brief me", "briefme", "brief man", "morning briefing", "my morning briefing", "give me my briefing", "give me the briefing", "give me my morning briefing", "daily briefing", "my briefing", "what's my briefing", "whats my briefing", "run the briefing", "run my briefing",
                      # "Catch me up!" asked "Did you mean...?"; "What's my daily update?" was a memory question.
                      "catch me up", "give me the rundown", "the rundown", "daily update", "my daily update", "what's my daily update",
                      "whats my daily update", "what is my daily update", "give me my daily update", "morning update", "my morning update",
                      "quick briefing", "a quick briefing", "news briefing", "give me a briefing"]
# Typed while the briefing is running: ends it like Stop. (Spoken "skip"
# while she asks to confirm is a cancel word, [conversation] cancel_words.)
skip_words = ["skip", "skip it", "skip the briefing", "skip briefing"]

[briefing.texts]
greeting_early_morning = "Good morning, {name}."
greeting_morning = "Good morning, {name}."
greeting_afternoon = "Good afternoon, {name}."
greeting_evening = "Good evening, {name}."
greeting_late_night = "Hello, {name}."
date = "It's {weekday} the {day} of {month}."
headlines = "In the news: {titles}."
offline = "I can't reach the internet for weather and news right now."
weather_failed = "I couldn't get the weather."
headlines_failed = "I couldn't get the headlines."
no_city = "No default city is set, so no weather."
cooling = "The free limit for news is reached until {until}, so no headlines."
more_in_activity = "More in Live Activity."

[system]
# F22 system settings (built). No terminal command anywhere
# (R10): pycaw (volume, mute), screen-brightness-control (brightness),
# WinRT Windows.Devices.Radios (Wi-Fi), user32 LockWorkStation (lock), and
# pywin32 InitiateSystemShutdown / AbortSystemShutdown (restart, shutdown,
# never force). Every change is read back afterwards (R12).
volume_step_percent = 10
brightness_step_percent = 10
# A spoken "up by N" larger than this is refused before policy.
max_step_percent = 50
volume_tolerance_percent = 1
# Panels move in steps, so a read-back this close counts as done.
brightness_tolerance_percent = 5
verify_timeout_seconds = 5.0
verify_poll_interval_seconds = 0.25
# The OS's own countdown before a restart/shutdown; Stop or "cancel" aborts it.
shutdown_grace_seconds = 30
# The message Windows shows during the countdown.
shutdown_message = "JARVIS: restart or shutdown requested by voice. Save your work."

[system.replies]
volume_now = "Volume is now {value}%."
muted = "Muted."
unmuted = "Unmuted. Volume is {value}%."
already_muted = "It's already muted."
brightness_now = "Brightness is now {value}%."
troubleshooting = "Troubleshooting the issue."
mismatch_volume = "I set the volume to {target}%, but it's reading {actual}%."
mismatch_brightness = "I set the brightness to {target}%, but it's reading {actual}%."
mismatch_mute = "I tried to {verb} it, but Windows still reports it {state}."
out_of_range = "{what} goes from 0 to 100."
step_too_big = "That's a big jump. Change it by at most {max} at a time."
no_speakers = "No speakers found. Plug in or turn on your speakers, then try again."
brightness_unsupported = "Brightness isn't controllable on this display."
brightness_unsupported_mac = "Changing brightness isn't supported on macOS."
wifi_prompt_on = "Turn Wi-Fi on? Say confirm."
wifi_prompt_off = "Turn Wi-Fi off? Every online feature stops working until it's back on. Say confirm."
wifi_now = "Wi-Fi is now {state}."
wifi_already = "Wi-Fi is already {state}."
wifi_refused = "Windows doesn't allow JARVIS to switch Wi-Fi on this laptop."
wifi_no_radio = "I can't find a Wi-Fi radio on this laptop."
wifi_mismatch = "I asked Windows to turn Wi-Fi {target}, but it's still {actual}. A hardware switch or a policy may be holding it."
lock_prompt = "Lock the screen? You'll need to sign in again. Say confirm."
lock_requested = "Screen lock requested."
lock_failed = "Windows didn't lock the screen."
restart_prompt = "Restart in {seconds} seconds. Apps won't be force-closed. Unsaved work in another app may stop the restart. Say confirm twice."
shutdown_prompt = "Shut down in {seconds} seconds. Apps won't be force-closed. Unsaved work in another app may stop the shutdown. Say confirm twice."
restart_requested = "Restart requested. It starts in {seconds} seconds unless an app stops it. Say stop to cancel."
shutdown_requested = "Shutdown requested. It starts in {seconds} seconds unless an app stops it. Say stop to cancel."
privilege_refused = "Windows didn't allow me to {verb}, so no {noun} was requested."
cancelled = "{Noun} cancelled."
too_late = "It's too late to cancel: Windows is already {doing}."
nothing_scheduled = "There's no restart or shutdown to cancel."

[youtube]
# Captions shorter than this are not summarised
# (Groq made a summary up from a few words); she says so instead.
min_transcript_chars = 200
# F18 YouTube tools (built). "play X on YouTube" opens
# YouTube's search results for X in his own Chrome (F3's open_url, L1, no
# automation). "summarise this video <link>" / "summarise the YouTube video
# about X" fetches the public transcript (youtube-transcript-api 1.2.4: an
# unofficial library that reads YouTube's own web endpoints) and summarises
# it online (L0: internet content, not laptop data, so no R4 preview; R3 still
# applies). URLs are never spoken.
search_url_template = "https://www.youtube.com/results?search_query={query}"
preferred_transcript_languages = ["en"]
spoken_summary_sentences = 3
# "about X": one web search for his words; the video is taken only from the
# search tool's own result links (never a link the model wrote).
find_query_template = "YouTube video about {topic}"
find_instructions = "Use browser_search exactly once to find a YouTube video that matches the request. Do not open any page. Reply with one short sentence."
summary_instructions = "You are given part of a YouTube video's transcript. Summarise what the video says in at most four plain sentences, for reading aloud. Say only what the transcript says; if it is unclear or garbled, say so."
combine_instructions = "You are given summaries of consecutive parts of one YouTube video's transcript. Combine them into one summary of at most four plain sentences, for reading aloud. Say only what they say."
play_patterns = ["play (?P<what>.+?) on (?:youtube|you tube)", "(?:search|look up) (?:youtube|you tube) for (?P<what>.+)", "(?:youtube|you tube) (?P<what>.+)", "play (?P<what>.+?) (?:youtube|you tube)",
                 # "Hello, free music on YouTube" (Whisper's "play"), "sad music on YouTube"
                 "(?:(?:hello|hi|hey|ok|okay|so|and) )?(?:free|pray|pre|prey|played|plays|lay|clay|flay|pay) (?P<what>.+?) on (?:youtube|you tube)",
                 "(?:(?:hello|hi|hey|ok|okay|so|and) )?(?P<what>(?:[a-z']+ ){0,3}(?:music|songs?|playlist)) on (?:youtube|you tube)"]

[youtube.replies]
searching = "Searching YouTube for {query} in Chrome."
no_chrome = "I'd search YouTube for {query} in Chrome, but Chrome isn't installed. Install Google Chrome, then try again."
which_video = "Which video? Type its link after summarise this video, or say summarise the YouTube video about, and the topic."
bad_link = "I couldn't read a YouTube video in that link. Check it and try again."
not_found = "I couldn't find a YouTube video about {topic}."
no_transcript = "This video has no transcript, so I can't summarise it."
too_short = "That video doesn't have enough captions to summarise."
unavailable = "That video is unavailable or private, so I can't get its transcript."
unplayable = "That video can't be played here, so I can't get its transcript."
age_restricted = "That video is age-restricted, so I can't get its transcript."
blocked = "YouTube is blocking transcript requests from this connection right now. Try again later."
po_token = "YouTube now needs a check this tool can't do, so its transcripts are unavailable."
cannot_reach = "I can't reach YouTube right now. Check your internet connection, then try again."
youtube_error = "YouTube didn't answer properly, so I couldn't get the transcript. Try again in a few minutes."
rate_limited = "YouTube's limit for transcripts is reached; it is off until {until}."
auto_captions = "These are auto-generated captions, so names and terms may be wrong."
coverage = "I summarised the first {covered} of {total} minutes."
summary_failed = "I got the transcript, but couldn't summarise it. {reason}"

[file_processor]
# (after the "summarize my resume" list, "Find number one"
# searched files for 'number one' and "will summarize file one" said "can't find
# file one"). While that list waits, these lead words are dropped before the
# pick is read, so "find number one" / "summarize file one" pick item 1.
pick_lead_words = ["will", "well", "we'll", "can", "could", "you", "please", "now", "ok", "okay", "so", "and", "just", "then",
                   "find", "summarise", "summarize", "summary", "sum", "up", "read", "open", "show", "do", "get", "use", "go", "with",
                   "jarvis", "let's", "lets", "i", "want", "would", "like", "for", "me", "of", "on"]
# F19 file processor (built). "summarise <file>", "what's in
# <file>", "read <file>" (and "how many pages / words / rows in <file>").
# The file is found through F4's index (the same numbered pick list), must
# pass the R9 read check, and is read LOCALLY: PDF (pypdf), DOCX
# (python-docx), TXT/MD, CSV (standard library). Only "summarise" goes
# online, after the R4 preview of the exact text and an L3 confirm. JARVIS
# never writes to his files; there is no conversion.
extensions = [".pdf", ".docx", ".txt", ".md", ".csv"]
# Words that say he means a file even if the index has nothing by that name.
file_words = ["file", "document", "pdf", "docx", "word document", "text file", "csv", "spreadsheet", "notes"]
max_file_bytes = 20000000
# Only the first this many pages of a PDF are read.
max_pdf_pages = 200
# Below this many characters per page on average: a scanned PDF.
min_chars_per_page = 30
max_csv_rows_sent = 200
text_encodings_tried = ["utf-8", "utf-8-sig", "cp1252"]
# The R4 copy of exactly what will be sent; deleted after sending, on
# cancel/Stop/expiry, and at startup (leftovers).
temp_dir = "jarvis_data/tmp"
max_text_preview_chars = 200000
# "read <file>": this many words are read aloud.
read_aloud_words = 60
summary_instructions = "You are given part of a document the developer chose to send. Summarise it in at most four plain sentences, for reading aloud. Say only what the text says."
combine_instructions = "You are given summaries of consecutive parts of one document. Combine them into one summary of at most four plain sentences, for reading aloud. Say only what they say."
spoken_summary_sentences = 3

[file_processor.replies]
which_file = "I found {count} files called that. Which one? Say its number."
not_found = "I can't find a PDF, Word, text or CSV file called {name}."
index_not_ready = "I'm still building the file index. Try again in a moment."
protected = "I can't read {name}: it's in a protected folder."
too_big = "{name} is {size} MB, over the 20 MB I read. Pick a smaller file."
unsupported = "I can read PDF, Word, text and CSV files, not {ext} files."
unreadable = "I couldn't read {name}: {reason}."
scanned = "{name} looks like a scanned PDF; I can't read scanned pages."
encrypted = "{name} is password-protected, so I can't read it. I never ask for or handle passwords."
empty = "{name} has no text I can read."
overview_pdf = "{name} has {pages} and about {words} words."
overview_text = "{name} has about {words} words."
overview_csv = "{name} has {rows} rows and {columns} columns: {headers}."
pages_truncated = "I read only the first {max} pages."
offer_summary = "Say summarise {name} to have it summarised online."
read_start = "Here's how {name} starts: {text}"
read_more = "That's the start."
which_part = "This file is long. Which part: the start, the middle, or the end?"
confirm_prompt = "Here's exactly what would be sent online from {name}: {chars} characters. Check the preview, then say confirm, or cancel."
preview_changed = "The text changed after you confirmed; please check the preview again. Nothing was sent."
summary_failed = "I couldn't summarise {name}. {reason}"
cooling = "Summaries online are off until {until}, because the free limit was reached. I can still tell you what's in the file."
